<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>VaultForge Admin</title>

<style>
body{
background:#07122a;
color:#fff;
font-family:Arial;
padding:20px;
}
button{
padding:14px;
margin:6px;
border-radius:10px;
border:none;
cursor:pointer;
}
.card{
background:#0c1b3a;
padding:15px;
margin-top:15px;
border-radius:12px;
}
.green{background:#16a34a;}
.red{background:#dc2626;}
.orange{background:#f59e0b;}
.blue{background:#3b82f6;}
</style>
</head>

<body>

<h2>VAULTFORGE ADMIN</h2>

<button onclick="go('listing-form.html')">Create Listing</button>
<button onclick="loadListings()">Refresh</button>
<button onclick="go('members.html')">Members</button>
<button onclick="go('pain.html')">Pain</button>

<div id="listings"></div>

<script>
const SUPA_URL = "https://mnwwvpuxrzostrplfgmq.supabase.co/rest/v1/property_cards";
const KEY = "sb_publishable_sXXlF9GsNcVYnr2BxABAwg_T-BV19qJ";

function go(path){
window.location.href = path;
}

async function loadListings(){
const res = await fetch(SUPA_URL,{
headers:{
apikey:KEY,
Authorization:"Bearer "+KEY
}
});
const data = await res.json();

let html="";
data.forEach(d=>{
html+=`
<div class="card">
<b>${d.title || "No title"}</b><br>
${d.state || ""} | ${d.property_type || ""}<br><br>

<button onclick="view('${d.id}')">View</button>
<button onclick="edit('${d.id}')">Edit</button>
<button class="green" onclick="setLive('${d.id}')">Approve / Live</button>
<button class="orange" onclick="setDraft('${d.id}')">Set Draft</button>
<button class="red" onclick="del('${d.id}')">Delete</button>
</div>
`;
});

document.getElementById("listings").innerHTML=html;
}

function view(id){
window.location.href = "listing.html?id="+id;
}

function edit(id){
window.location.href = "listing-form.html?edit="+id;
}

async function setLive(id){
await fetch(SUPA_URL+"?id=eq."+id,{
method:"PATCH",
headers:{
apikey:KEY,
Authorization:"Bearer "+KEY,
"Content-Type":"application/json"
},
body:JSON.stringify({status:"Active"})
});
loadListings();
}

async function setDraft(id){
await fetch(SUPA_URL+"?id=eq."+id,{
method:"PATCH",
headers:{
apikey:KEY,
Authorization:"Bearer "+KEY,
"Content-Type":"application/json"
},
body:JSON.stringify({status:"Draft"})
});
loadListings();
}

async function del(id){
await fetch(SUPA_URL+"?id=eq."+id,{
method:"DELETE",
headers:{
apikey:KEY,
Authorization:"Bearer "+KEY
}
});
loadListings();
}

loadListings();
</script>

</body>
</html>
