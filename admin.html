<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>VaultForge Admin</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    body{margin:0;background:#071844;color:#fff;font-family:Arial,sans-serif}
    .wrap{max-width:1200px;margin:0 auto;padding:20px}
    .card{background:#0d1f59;border-radius:24px;padding:24px}
    h1{margin:0 0 10px;font-size:36px}
    h2{margin:0 0 8px;font-size:22px}
    p{color:#c6d0f2}
    input,button{padding:16px;border-radius:16px;font-size:16px}
    input{width:100%;box-sizing:border-box;border:1px solid rgba(255,255,255,.12);background:#02113f;color:#fff}
    button{border:none;background:#e2c465;color:#1e1604;font-weight:900;cursor:pointer}
    .tabs{display:flex;gap:10px;flex-wrap:wrap;margin:18px 0}
    .box{margin-top:18px;padding:16px;border-radius:16px;white-space:pre-wrap}
    .status{background:#10255f}
    .error{background:#4a1f37}
    .success{background:#173d2d}
    .list{display:grid;gap:14px;margin-top:18px}
    .item{background:#09153f;border-radius:18px;padding:16px}
    .hidden{display:none}
    .stats{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin:18px 0}
    .stat{background:#09153f;border-radius:18px;padding:16px}
    .label{color:#c6d0f2;font-size:14px;margin-bottom:8px}
    .value{font-size:28px;font-weight:900}
    .meta{color:#c6d0f2;line-height:1.5}
    .actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px}
    .btn-small{padding:10px 12px;border-radius:12px;font-size:14px}
    .btn-blue{background:#1d4ed8;color:#fff}
    .btn-green{background:#16a34a;color:#fff}
    .btn-red{background:#b91c1c;color:#fff}
    .btn-gray{background:#475569;color:#fff}
    .pill{display:inline-block;padding:7px 12px;border-radius:999px;font-size:12px;font-weight:700;margin:6px 6px 0 0}
    .pill-open{background:#5b213a;color:#ffd7e3}
    .pill-review{background:#3b3317;color:#fff1b9}
    .pill-resolved{background:#193b2f;color:#bcf5dc}
    .pill-closed{background:#334155;color:#e2e8f0}
    .pill-low{background:#193b2f;color:#bcf5dc}
    .pill-medium{background:#3b3317;color:#fff1b9}
    .pill-urgent{background:#5b213a;color:#ffd7e3}
    a{color:#c6d0f2}
    @media(max-width:900px){.stats{grid-template-columns:1fr 1fr}}
    @media(max-width:500px){.stats{grid-template-columns:1fr}}
  </style>
</head>
<body>
  <div class="wrap">
    <p><a href="/">← Home</a> | <a href="/members.html">Members</a> | <a href="/partners.html">Partners</a></p>

    <div id="loginCard" class="card">
      <h1>Admin Login</h1>
      <p>Enter password to access admin.</p>
      <input id="passwordInput" type="password" placeholder="Password">
      <button id="loginBtn" style="width:100%;margin-top:14px;">Enter Admin</button>
      <div id="loginStatus" class="box status">Waiting for password.</div>
    </div>

    <div id="adminCard" class="card hidden">
      <h1>VaultForge Admin</h1>

      <div class="stats">
        <div class="stat"><div class="label">Applications</div><div id="appsCount" class="value">0</div></div>
        <div class="stat"><div class="label">Pain Requests</div><div id="painCount" class="value">0</div></div>
        <div class="stat"><div class="label">Open Pain</div><div id="openCount" class="value">0</div></div>
        <div class="stat"><div class="label">Urgent / Immediate</div><div id="urgentCount" class="value">0</div></div>
      </div>

      <div class="tabs">
        <button id="showAppsBtn">Applications</button>
        <button id="showPainBtn">Pain Requests</button>
        <button id="reloadBtn">Reload</button>
        <button id="logoutBtn">Logout</button>
      </div>

      <div id="adminStatus" class="box status">Admin ready.</div>

      <div id="appsList" class="list"></div>
      <div id="painList" class="list hidden"></div>
    </div>
  </div>

  <script>
    (function () {
      var loginCard = document.getElementById('loginCard');
      var adminCard = document.getElementById('adminCard');
      var loginStatus = document.getElementById('loginStatus');
      var adminStatus = document.getElementById('adminStatus');
      var appsList = document.getElementById('appsList');
      var painList = document.getElementById('painList');

      function box(el, cls, text) {
        el.className = 'box ' + cls;
        el.textContent = text;
      }

      function safe(value) {
        return String(value == null ? '' : value)
          .replace(/&/g, '&amp;')
          .replace(/</g, '&lt;')
          .replace(/>/g, '&gt;')
          .replace(/"/g, '&quot;')
          .replace(/'/g, '&#39;');
      }

      function fmtDate(value) {
        if (!value) return '';
        try { return new Date(value).toLocaleString(); }
        catch (e) { return value; }
      }

      function statusPill(status) {
        var s = String(status || '').toLowerCase();
        if (s === 'resolved') return 'pill pill-resolved';
        if (s === 'closed') return 'pill pill-closed';
        if (s === 'in_review') return 'pill pill-review';
        return 'pill pill-open';
      }

      function urgencyPill(urgency) {
        var u = String(urgency || '').toLowerCase();
        if (u === 'low') return 'pill pill-low';
        if (u === 'medium') return 'pill pill-medium';
        return 'pill pill-urgent';
      }

      try {
        if (!window.supabase || !window.supabase.createClient) {
          box(loginStatus, 'error', 'Supabase library failed to load.');
          return;
        }

        var ADMIN_PASSWORD = 'Vault123!';
        var SUPABASE_URL = 'https://mnwwvpuxrzostrplfgmq.supabase.co';
        var SUPABASE_KEY = 'sb_publishable_sXXlF9GsNcVYnr2BxABAwg_T-BV19qJ';
        var supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

        function showAdmin() {
          loginCard.classList.add('hidden');
          adminCard.classList.remove('hidden');
          sessionStorage.setItem('vf_admin_ok', '1');
        }

        function showLogin() {
          adminCard.classList.add('hidden');
          loginCard.classList.remove('hidden');
          sessionStorage.removeItem('vf_admin_ok');
        }

        async function loadApps() {
          appsList.innerHTML = '<div class="item">Loading applications...</div>';

          var result = await supabase
            .from('applications')
            .select('*')
            .order('created_at', { ascending: false });

          if (result.error) {
            appsList.innerHTML = '<div class="item">Applications error: ' + safe(result.error.message) + '</div>';
            document.getElementById('appsCount').textContent = '0';
            return;
          }

          var rows = result.data || [];
          document.getElementById('appsCount').textContent = rows.length;

          if (!rows.length) {
            appsList.innerHTML = '<div class="item">No applications found.</div>';
            return;
          }

          appsList.innerHTML = rows.map(function (row) {
            return '<div class="item">' +
              '<h2>' + safe(row.name || 'Unnamed Applicant') + '</h2>' +
              '<div class="meta">' +
              '<strong>Email:</strong> ' + safe(row.email || '') + '<br>' +
              '<strong>Market:</strong> ' + safe(row.market || '') + '<br>' +
              (row.role ? '<strong>Role:</strong> ' + safe(row.role) + '<br>' : '') +
              (row.phone ? '<strong>Phone:</strong> ' + safe(row.phone) + '<br>' : '') +
              '<strong>Created:</strong> ' + safe(fmtDate(row.created_at || '')) +
              '</div>' +
              '</div>';
          }).join('');
        }

        async function updatePainStatus(id, nextStatus) {
          box(adminStatus, 'status', 'Updating request #' + id + '...');

          var result = await supabase
            .from('pain_requests')
            .update({ status: nextStatus })
            .eq('id', id);

          if (result.error) {
            box(adminStatus, 'error', 'Update failed: ' + result.error.message);
            return;
          }

          box(adminStatus, 'success', 'Request #' + id + ' updated to ' + nextStatus + '.');
          await loadPain();
        }

        async function loadPain() {
          painList.innerHTML = '<div class="item">Loading pain requests...</div>';

          var result = await supabase
            .from('pain_requests')
            .select('*')
            .order('created_at', { ascending: false });

          if (result.error) {
            painList.innerHTML = '<div class="item">Pain requests error: ' + safe(result.error.message) + '</div>';
            document.getElementById('painCount').textContent = '0';
            document.getElementById('openCount').textContent = '0';
            document.getElementById('urgentCount').textContent = '0';
            return;
          }

          var rows = result.data || [];
          document.getElementById('painCount').textContent = rows.length;
          document.getElementById('openCount').textContent = rows.filter(function (x) {
            return String(x.status || '').toLowerCase() === 'open';
          }).length;
          document.getElementById('urgentCount').textContent = rows.filter(function (x) {
            var u = String(x.urgency || '').toLowerCase();
            return u === 'urgent' || u === 'immediate';
          }).length;

          if (!rows.length) {
            painList.innerHTML = '<div class="item">No pain requests found.</div>';
            return;
          }

          painList.innerHTML = rows.map(function (row) {
            return '<div class="item">' +
              '<h2>#' + safe(row.id) + ' ' + safe(row.name || '') + '</h2>' +
              '<div class="meta">' +
              '<strong>Email:</strong> ' + safe(row.email || '') + '<br>' +
              '<strong>Market:</strong> ' + safe(row.market || '') + '<br>' +
              '<strong>Created:</strong> ' + safe(fmtDate(row.created_at || '')) +
              '</div>' +
              '<div>' +
              '<span class="' + urgencyPill(row.urgency) + '">' + safe(row.urgency || '') + '</span>' +
              '<span class="' + statusPill(row.status) + '">Status: ' + safe(row.status || 'open') + '</span>' +
              '<span class="pill pill-open">Need: ' + safe(row.needed_role || '') + '</span>' +
              (row.budget ? '<span class="pill pill-open">Budget: ' + safe(row.budget) + '</span>' : '') +
              '</div>' +
              '<p>' + safe(row.problem || '') + '</p>' +
              '<div class="actions">' +
              '<button class="btn-small btn-gray" data-id="' + safe(row.id) + '" data-status="open">Open</button>' +
              '<button class="btn-small btn-blue" data-id="' + safe(row.id) + '" data-status="in_review">In Review</button>' +
              '<button class="btn-small btn-green" data-id="' + safe(row.id) + '" data-status="resolved">Resolved</button>' +
              '<button class="btn-small btn-red" data-id="' + safe(row.id) + '" data-status="closed">Closed</button>' +
              '</div>' +
              '</div>';
          }).join('');

          Array.prototype.slice.call(painList.querySelectorAll('button[data-status]')).forEach(function (btn) {
            btn.addEventListener('click', async function () {
              var id = this.getAttribute('data-id');
              var nextStatus = this.getAttribute('data-status');
              await updatePainStatus(id, nextStatus);
            });
          });
        }

        async function loadAll() {
          box(adminStatus, 'status', 'Loading...');
          await loadApps();
          await loadPain();
          box(adminStatus, 'success', 'Loaded.');
        }

        document.getElementById('loginBtn').onclick = async function () {
          var pass = document.getElementById('passwordInput').value;
          if (pass !== ADMIN_PASSWORD) {
            box(loginStatus, 'error', 'Wrong password');
            return;
          }
          showAdmin();
          await loadAll();
        };

        document.getElementById('showAppsBtn').onclick = function () {
          appsList.classList.remove('hidden');
          painList.classList.add('hidden');
          box(adminStatus, 'status', 'Showing applications.');
        };

        document.getElementById('showPainBtn').onclick = function () {
          painList.classList.remove('hidden');
          appsList.classList.add('hidden');
          box(adminStatus, 'status', 'Showing pain requests.');
        };

        document.getElementById('reloadBtn').onclick = loadAll;

        document.getElementById('logoutBtn').onclick = function () {
          showLogin();
        };

        document.getElementById('passwordInput').addEventListener('keydown', function (e) {
          if (e.key === 'Enter') {
            e.preventDefault();
            document.getElementById('loginBtn').click();
          }
        });

        if (sessionStorage.getItem('vf_admin_ok') === '1') {
          showAdmin();
          loadAll();
        }
      } catch (err) {
        box(loginStatus, 'error', 'Page script failed: ' + (err && err.message ? err.message : String(err)));
      }
    })();
  </script>
</body>
</html>
