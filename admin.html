<script>
const supabase = window.supabase.createClient(
  'https://mnwwvpuxrzostrplfgmq.supabase.co',
  'sb_publishable_sXXlF9GsNcVYnr2BxABAwg_T-BV19qJ'
);

let listings = [];
let members = [];
let currentListingMode = 'all';
let currentMemberMode = 'all';

function setStatus(msg){
  document.getElementById('statusBox').textContent = msg;
}
function esc(v){
  return String(v ?? '')
    .replaceAll('&','&amp;')
    .replaceAll('<','&lt;')
    .replaceAll('>','&gt;')
    .replaceAll('"','&quot;')
    .replaceAll("'",'&#39;');
}
function fmtMoney(v){
  const n = Number(v);
  return Number.isFinite(n)
    ? new Intl.NumberFormat('en-US',{style:'currency',currency:'USD',maximumFractionDigits:0}).format(n)
    : '—';
}
function isActiveListing(r){
  return ['active','live','approved'].includes(String(r.status||'').toLowerCase());
}
function normalizeState(v){
  const s = String(v||'').trim().toLowerCase();
  if(s==='ga') return 'georgia';
  if(s==='fl') return 'florida';
  if(s==='tn') return 'tennessee';
  return s;
}
function normalizeRole(v){
  return String(v||'').trim().toLowerCase();
}

function filteredListings(){
  const searchEl = document.getElementById('listingSearch');
  const q = searchEl ? searchEl.value.trim().toLowerCase() : '';
  let arr = [...listings];

  if(currentListingMode === 'draft'){
    arr = arr.filter(r => String(r.status||'').toLowerCase() === 'draft');
  }
  if(currentListingMode === 'active'){
    arr = arr.filter(isActiveListing);
  }
  if(currentListingMode === 'commercial'){
    arr = arr.filter(r => String(r.property_type||'').toLowerCase().includes('comm'));
  }
  if(currentListingMode === 'stale'){
    const cutoff = Date.now() - (1000 * 60 * 60 * 24 * 30);
    arr = arr.filter(r => new Date(r.created_at || 0).getTime() < cutoff);
  }

  if(q){
    arr = arr.filter(r =>
      [r.title, r.city, r.state, r.property_type].join(' ').toLowerCase().includes(q)
    );
  }

  return arr.slice(0, 12);
}

function filteredMembers(){
  const searchEl = document.getElementById('memberSearch');
  const q = searchEl ? searchEl.value.trim().toLowerCase() : '';
  let arr = [...members];

  if(currentMemberMode === 'ga_lenders'){
    arr = arr.filter(r =>
      normalizeState(r.primary_market).includes('georgia') &&
      normalizeRole(r.role).includes('lender')
    );
  }
  if(currentMemberMode === 'fl_buyers'){
    arr = arr.filter(r =>
      normalizeState(r.primary_market).includes('florida') &&
      (normalizeRole(r.role).includes('buyer') || normalizeRole(r.role).includes('investor'))
    );
  }
  if(currentMemberMode === 'tn_operators'){
    arr = arr.filter(r =>
      normalizeState(r.primary_market).includes('tennessee') &&
      (normalizeRole(r.role).includes('operator') || normalizeRole(r.role).includes('developer'))
    );
  }
  if(currentMemberMode === 'lender_investor'){
    arr = arr.filter(r =>
      normalizeRole(r.role).includes('lender') || normalizeRole(r.role).includes('investor')
    );
  }
  if(currentMemberMode === 'buyer_wholesaler'){
    arr = arr.filter(r =>
      normalizeRole(r.role).includes('buyer') || normalizeRole(r.role).includes('wholesaler')
    );
  }
  if(currentMemberMode === 'jv_operator'){
    arr = arr.filter(r =>
      normalizeRole(r.role).includes('operator') ||
      String(r.investment_focus||'').toLowerCase().includes('jv') ||
      normalizeRole(r.role).includes('developer')
    );
  }

  if(q){
    arr = arr.filter(r =>
      [r.full_name, r.role, r.primary_market, r.company_name].join(' ').toLowerCase().includes(q)
    );
  }

  return arr.slice(0, 12);
}

function renderListings(){
  const box = document.getElementById('listingQueue');
  if(!box) return;

  const rows = filteredListings();

  const titleEl = document.getElementById('queueTitle');
  if(titleEl){
    titleEl.textContent =
      currentListingMode === 'draft' ? 'Draft Listings Queue' :
      currentListingMode === 'active' ? 'Active Listings Queue' :
      currentListingMode === 'commercial' ? 'Commercial Listings Queue' :
      currentListingMode === 'stale' ? 'Stale Listings Queue' :
      'Listings Queue';
  }

  if(!rows.length){
    box.innerHTML = '<div class="small">No listings found for this filter.</div>';
    return;
  }

  box.innerHTML = rows.map(r => `
    <div class="queue-card">
      <div style="font-weight:900;font-size:20px">${esc(r.title || 'Untitled Listing')}</div>
      <div class="pills">
        <span class="pill">${esc(r.status || 'Draft')}</span>
        <span class="pill">${esc(r.state || '—')}</span>
        <span class="pill">${esc(r.property_type || '—')}</span>
      </div>
      <div class="small">${esc(r.city || '—')} • ${esc(fmtMoney(r.price))}</div>
      <div class="toolbar" style="margin-top:12px">
        <a class="btn dark" href="/listing.html?id=${encodeURIComponent(r.id)}">View</a>
        <a class="btn blue" href="/listing-form.html?edit=${encodeURIComponent(r.id)}">Edit</a>
        <button class="btn green" type="button" onclick="setListingStatus('${String(r.id).replaceAll("'", "\\'")}','Active')">Approve / Live</button>
        <button class="btn warn" type="button" onclick="setListingStatus('${String(r.id).replaceAll("'", "\\'")}','Draft')">Set Draft</button>
        <button class="btn red" type="button" onclick="deleteListing('${String(r.id).replaceAll("'", "\\'")}')">Delete</button>
      </div>
    </div>
  `).join('');
}

function renderMembers(){
  const box = document.getElementById('memberQueue');
  if(!box) return;

  const rows = filteredMembers();

  const titleEl = document.getElementById('memberTitle');
  if(titleEl){
    titleEl.textContent =
      currentMemberMode === 'ga_lenders' ? 'Georgia Lenders' :
      currentMemberMode === 'fl_buyers' ? 'Florida Buyers / Investors' :
      currentMemberMode === 'tn_operators' ? 'Tennessee Operators' :
      currentMemberMode === 'lender_investor' ? 'Lenders + Investors' :
      currentMemberMode === 'buyer_wholesaler' ? 'Buyers + Wholesalers' :
      currentMemberMode === 'jv_operator' ? 'JV + Operators' :
      'Member Directory Slice';
  }

  if(!rows.length){
    box.innerHTML = '<div class="small">No members found for this filter.</div>';
    return;
  }

  box.innerHTML = rows.map(r => `
    <div class="queue-card">
      <div style="font-weight:900;font-size:18px">${esc(r.full_name || 'Unnamed Member')}</div>
      <div class="pills">
        <span class="pill">${esc(r.role || 'Role not set')}</span>
        <span class="pill">${esc(r.primary_market || 'Market not set')}</span>
      </div>
      <div class="small">${esc(r.company_name || 'No company')}</div>
    </div>
  `).join('');
}

async function setListingStatus(id, status){
  const ok = confirm('Set listing to ' + status + '?');
  if(!ok) return;

  setStatus('Saving ' + status + '...');
  const { error } = await supabase.from('property_cards').update({ status }).eq('id', id);

  if(error){
    setStatus(error.message);
    return;
  }

  await loadCounts();
  setStatus('Saved ' + status + '.');
}

async function deleteListing(id){
  const ok = confirm('Delete listing?');
  if(!ok) return;

  setStatus('Deleting listing...');
  const { error } = await supabase.from('property_cards').delete().eq('id', id);

  if(error){
    setStatus(error.message);
    return;
  }

  await loadCounts();
  setStatus('Listing deleted.');
}

async function approveAllDrafts(){
  const drafts = listings.filter(r => String(r.status||'').toLowerCase() === 'draft');

  if(!drafts.length){
    setStatus('No draft listings found.');
    return;
  }

  const ok = confirm('Approve all draft listings?');
  if(!ok) return;

  setStatus('Approving drafts...');
  const ids = drafts.map(r => r.id);
  const { error } = await supabase.from('property_cards').update({ status:'Active' }).in('id', ids);

  if(error){
    setStatus(error.message);
    return;
  }

  await loadCounts();
  currentListingMode = 'active';
  renderListings();
  setStatus('All drafts approved.');
}

function featureTopListing(){
  const top = listings[0];
  if(!top){
    setStatus('No listings available to feature.');
    return;
  }

  setStatus('Opening top listing in editor.');
  window.location.href = '/listing-form.html?edit=' + encodeURIComponent(top.id);
}

async function safeQuery(fn, fallback){
  try{
    return await fn();
  }catch(e){
    console.log(e);
    return fallback;
  }
}

async function loadCounts(){
  setStatus('Loading admin...');

  const memberResp = await safeQuery(
    () => supabase.from('member_profiles').select('*', { count:'exact' }),
    { data: [], count: 0, error: null }
  );

  const listingResp = await safeQuery(
    () => supabase.from('property_cards').select('*', { count:'exact' }).order('created_at', { ascending:false }),
    { data: [], count: 0, error: null }
  );

  members = memberResp.data || [];
  listings = listingResp.data || [];

  let painCount = 0;

  const painResp = await safeQuery(
    () => supabase.from('pain').select('*', { count:'exact' }),
    { data: [], count: 0, error: true }
  );

  if(!painResp.error){
    painCount = painResp.count || (painResp.data || []).length || 0;
  } else {
    const painResp2 = await safeQuery(
      () => supabase.from('pain_requests').select('*', { count:'exact' }),
      { data: [], count: 0, error: true }
    );
    if(!painResp2.error){
      painCount = painResp2.count || (painResp2.data || []).length || 0;
    }
  }

  const memberCountEl = document.getElementById('memberCount');
  const listingCountEl = document.getElementById('listingCount');
  const painCountEl = document.getElementById('painCount');
  const draftCountEl = document.getElementById('draftCount');

  if(memberCountEl) memberCountEl.textContent = memberResp.count ?? members.length ?? 0;
  if(listingCountEl) listingCountEl.textContent = listingResp.count ?? listings.length ?? 0;
  if(painCountEl) painCountEl.textContent = painCount;
  if(draftCountEl) draftCountEl.textContent = listings.filter(r => String(r.status||'').toLowerCase() === 'draft').length;

  renderListings();
  renderMembers();
  setStatus('Admin ready.');
}

document.getElementById('refreshBtn')?.addEventListener('click', loadCounts);
document.getElementById('listingSearch')?.addEventListener('input', renderListings);
document.getElementById('memberSearch')?.addEventListener('input', renderMembers);
document.getElementById('approveDraftsBtn')?.addEventListener('click', approveAllDrafts);
document.getElementById('featureTopBtn')?.addEventListener('click', featureTopListing);
document.getElementById('openListingsBtn')?.addEventListener('click', ()=> window.location.href='/property-cards.html');
document.getElementById('openPainBtn')?.addEventListener('click', ()=> window.location.href='/pain.html');
document.getElementById('featuredUpsellBtn')?.addEventListener('click', ()=> { currentListingMode='active'; renderListings(); setStatus('Showing active listings for featured upsell review.'); });
document.getElementById('staleListingsBtn')?.addEventListener('click', ()=> { currentListingMode='stale'; renderListings(); setStatus('Showing stale listings.'); });
document.getElementById('boostActiveBtn')?.addEventListener('click', ()=> { currentListingMode='active'; renderListings(); setStatus('Showing active deals.'); });
document.getElementById('needCommercialBtn')?.addEventListener('click', ()=> { currentListingMode='commercial'; renderListings(); setStatus('Showing commercial listings.'); });
document.getElementById('allListingsBtn')?.addEventListener('click', ()=> { currentListingMode='all'; renderListings(); setStatus('Showing all listings.'); });
document.getElementById('needGALendersBtn')?.addEventListener('click', ()=> { currentMemberMode='ga_lenders'; renderMembers(); setStatus('Showing Georgia lenders.'); });
document.getElementById('needFLBuyersBtn')?.addEventListener('click', ()=> { currentMemberMode='fl_buyers'; renderMembers(); setStatus('Showing Florida buyers / investors.'); });
document.getElementById('needTNOperatorsBtn')?.addEventListener('click', ()=> { currentMemberMode='tn_operators'; renderMembers(); setStatus('Showing Tennessee operators.'); });
document.getElementById('matchLenderInvestorBtn')?.addEventListener('click', ()=> { currentMemberMode='lender_investor'; renderMembers(); setStatus('Showing lenders and investors.'); });
document.getElementById('matchBuyerWholesalerBtn')?.addEventListener('click', ()=> { currentMemberMode='buyer_wholesaler'; renderMembers(); setStatus('Showing buyers and wholesalers.'); });
document.getElementById('matchJVOperatorBtn')?.addEventListener('click', ()=> { currentMemberMode='jv_operator'; renderMembers(); setStatus('Showing JV and operators.'); });

loadCounts();
</script>
