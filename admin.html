<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>VaultForge Admin</title>

  <style>
    :root{
      --bg:#06111f;
      --bg2:#0a1930;
      --card:#10233f;
      --line:rgba(255,255,255,.08);
      --text:#fff;
      --muted:#9fb0d1;
      --gold:#d6ab4e;
      --blue:#4e8dff;
      --green:#15c67d;
      --red:#ff5f72;
      --warn:#f5a623;
      --radius:24px;
    }

    *{box-sizing:border-box}

    body{
      margin:0;
      font-family:Arial,Helvetica,sans-serif;
      color:var(--text);
      background:linear-gradient(180deg,var(--bg),var(--bg2));
    }

    .wrap{
      max-width:1400px;
      margin:auto;
      padding:24px;
    }

    .brand{
      font-size:42px;
      font-weight:900;
      letter-spacing:.08em;
      color:var(--gold);
      line-height:.95;
    }

    .sub{
      margin-top:8px;
      color:var(--muted);
      font-size:15px;
    }

    .top-actions{
      display:flex;
      gap:12px;
      flex-wrap:wrap;
      margin-top:24px;
    }

    .btn{
      border:none;
      border-radius:18px;
      padding:16px 22px;
      font-size:18px;
      font-weight:800;
      cursor:pointer;
      text-decoration:none;
      display:inline-flex;
      align-items:center;
      justify-content:center;
    }

    .blue{background:var(--blue);color:#fff}
    .dark{
      background:rgba(255,255,255,.05);
      border:1px solid var(--line);
      color:#fff;
    }

    .card{
      background:var(--card);
      border:1px solid var(--line);
      border-radius:var(--radius);
      padding:26px;
      margin-top:24px;
    }

    h2{
      margin:0 0 18px;
      font-size:34px;
    }

    .note{
      color:var(--muted);
      line-height:1.6;
      font-size:18px;
    }

    .list{
      display:grid;
      gap:14px;
    }

    .item-btn{
      width:100%;
      background:rgba(255,255,255,.03);
      border:1px solid var(--line);
      border-radius:18px;
      padding:18px;
      font-size:18px;
      font-weight:700;
      color:#fff;
      cursor:pointer;
      text-align:left;
    }

    .item-btn:hover{
      background:rgba(255,255,255,.06);
    }

    .status{
      margin-top:14px;
      color:var(--muted);
      font-size:15px;
      line-height:1.5;
    }

    @media(max-width:700px){
      .brand{font-size:28px}
      h2{font-size:28px}
      .btn{width:100%}
    }
  </style>
</head>

<body>
  <div class="wrap">

    <div class="brand">VAULTFORGE<br>ADMIN</div>
    <div class="sub">Owner Command Center</div>

    <div class="top-actions">
      <button class="btn blue" onclick="goCreate()">Create Listing</button>
      <button class="btn dark" onclick="goListings()">Open Listings Board</button>
      <button class="btn dark" onclick="goPain()">Open Pain</button>
      <button class="btn dark" onclick="goMembers()">Open Member View</button>
    </div>

    <div class="card">
      <h2>Owner Controls</h2>
      <div class="note">
        Safe admin build. These buttons are directly wired and do not rely on broken loading scripts.
      </div>
    </div>

    <div class="card">
      <h2>Fast Workflow</h2>
      <div class="list">
        <button class="item-btn" onclick="goListings()">1. Open Listings Board</button>
        <button class="item-btn" onclick="openFirstListing()">2. Click any View</button>
        <button class="item-btn" onclick="openFirstEdit()">3. Click Edit</button>
        <button class="item-btn" onclick="goPain()">4. Use Pain page</button>
      </div>
      <div class="status" id="workflowStatus">Ready.</div>
    </div>

    <div class="card">
      <h2>Growth Targets</h2>
      <div class="list">
        <button class="item-btn" onclick="filterMembers('georgia','lender')">Georgia Lenders</button>
        <button class="item-btn" onclick="filterMembers('florida','buyer')">Florida Buyers</button>
        <button class="item-btn" onclick="filterMembers('tennessee','operator')">Tennessee Operators</button>
      </div>
      <div class="status" id="growthStatus">These open a member search with prefilled filters.</div>
    </div>

    <div class="card">
      <h2>Revenue Focus</h2>
      <div class="list">
        <button class="item-btn" onclick="goFounderPage()">$49 Founder Access</button>
        <button class="item-btn" onclick="goListings()">Featured Listings Upsell</button>
        <button class="item-btn" onclick="goMembers()">Paid Network Expansion</button>
      </div>
      <div class="status" id="revenueStatus">These route to the most useful pages now.</div>
    </div>

  </div>

  <script>
    async function fetchListings(){
      try{
        const res = await fetch('https://mnwwvpuxrzostrplfgmq.supabase.co/rest/v1/property_cards?select=id,title&order=created_at.desc', {
          headers: {
            'apikey': 'sb_publishable_sXXlF9GsNcVYnr2BxABAwg_T-BV19qJ',
            'Authorization': 'Bearer sb_publishable_sXXlF9GsNcVYnr2BxABAwg_T-BV19qJ'
          }
        });
        if(!res.ok) return [];
        const data = await res.json();
        return Array.isArray(data) ? data : [];
      } catch(e){
        return [];
      }
    }

    function goCreate(){
      window.location.href = '/listing-form.html';
    }

    function goListings(){
      window.location.href = '/property-cards.html';
    }

    function goPain(){
      window.location.href = '/pain.html';
    }

    function goMembers(){
      window.location.href = '/members.html';
    }

    function goFounderPage(){
      window.location.href = '/founding.html';
    }

    async function openFirstListing(){
      const status = document.getElementById('workflowStatus');
      status.textContent = 'Looking for a listing...';
      const listings = await fetchListings();

      if(listings.length && listings[0].id){
        window.location.href = '/listing.html?id=' + encodeURIComponent(listings[0].id);
        return;
      }

      status.textContent = 'No listing found. Open Listings Board instead.';
    }

    async function openFirstEdit(){
      const status = document.getElementById('workflowStatus');
      status.textContent = 'Looking for a listing to edit...';
      const listings = await fetchListings();

      if(listings.length && listings[0].id){
        window.location.href = '/listing-form.html?edit=' + encodeURIComponent(listings[0].id);
        return;
      }

      status.textContent = 'No listing found to edit. Create one first.';
    }

    function filterMembers(state, role){
      const growth = document.getElementById('growthStatus');
      growth.textContent = 'Opening member view for ' + state + ' / ' + role + '.';
      window.location.href = '/members.html?state=' + encodeURIComponent(state) + '&role=' + encodeURIComponent(role);
    }
  </script>
</body>
</html>
