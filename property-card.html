<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>VaultForge Property Card</title>
  <style>
    :root{
      --bg:#08132f;
      --panel:#0d1b45;
      --text:#eef3ff;
      --muted:#9fb0da;
      --line:rgba(255,255,255,.12);
      --accent:#7ee0b7;
      --accent2:#7ab8ff;
      --danger:#d96b6b;
    }
    *{box-sizing:border-box}
    body{
      margin:0;
      font-family:Arial, Helvetica, sans-serif;
      background:linear-gradient(180deg,#05102a 0%, #08132f 100%);
      color:var(--text);
      min-height:100vh;
    }
    .wrap{
      max-width:920px;
      margin:0 auto;
      padding:24px 18px 48px;
    }
    h1{
      margin:0 0 8px;
      font-size:clamp(30px,4vw,42px);
      line-height:1.05;
    }
    .sub{
      color:var(--muted);
      font-size:15px;
      line-height:1.45;
      margin-bottom:18px;
    }
    .actions{
      display:flex;
      gap:10px;
      flex-wrap:wrap;
      margin-bottom:18px;
    }
    .btn{
      min-height:48px;
      padding:12px 18px;
      border-radius:14px;
      border:1px solid transparent;
      text-decoration:none;
      font-weight:800;
      display:inline-flex;
      align-items:center;
      justify-content:center;
      cursor:pointer;
      font-size:16px;
      background:transparent;
      color:var(--text);
    }
    .btn-primary{background:var(--accent);color:#071325}
    .btn-secondary{border-color:var(--line)}
    .btn-blue{background:var(--accent2);color:#071325}
    .btn-danger{border-color:rgba(217,107,107,.35);color:#ffd4d4}
    .panel{
      background:rgba(255,255,255,.03);
      border:1px solid var(--line);
      border-radius:22px;
      padding:20px;
      box-shadow:0 14px 40px rgba(0,0,0,.18);
    }
    .notice{
      display:none;
      margin-bottom:16px;
      border-radius:14px;
      padding:14px 16px;
      font-weight:700;
      line-height:1.4;
      word-break:break-word;
    }
    .notice.show{display:block}
    .notice.error{
      background:rgba(217,107,107,.12);
      border:1px solid rgba(217,107,107,.35);
      color:#ffd4d4;
    }
    .notice.info{
      display:block;
      background:rgba(255,255,255,.04);
      border:1px solid var(--line);
      color:#dfe7ff;
    }
    .cover{
      width:100%;
      aspect-ratio:16/9;
      border-radius:18px;
      border:1px solid var(--line);
      background:#0a1636 center/cover no-repeat;
      margin-bottom:18px;
      display:none;
    }
    .cover.show{display:block}
    .eyebrow{
      display:inline-flex;
      padding:7px 11px;
      border-radius:999px;
      font-size:12px;
      font-weight:800;
      margin-bottom:14px;
      border:1px solid var(--line);
      background:rgba(255,255,255,.03);
      color:var(--muted);
    }
    .location{
      color:var(--muted);
      font-size:16px;
      margin-bottom:18px;
    }
    .grid{
      display:grid;
      grid-template-columns:repeat(2,minmax(0,1fr));
      gap:14px;
      margin-bottom:18px;
    }
    .box{
      border:1px solid var(--line);
      border-radius:16px;
      padding:14px;
      background:rgba(255,255,255,.02);
    }
    .label{
      color:var(--muted);
      font-size:12px;
      margin-bottom:6px;
    }
    .value{
      font-size:16px;
      font-weight:700;
      word-break:break-word;
    }
    .section{
      margin-top:18px;
      padding-top:18px;
      border-top:1px solid var(--line);
    }
    .section-title{
      font-size:18px;
      font-weight:800;
      margin:0 0 10px;
    }
    .copy{
      color:#dfe7ff;
      line-height:1.6;
      white-space:pre-wrap;
    }
    .debug{
      margin-top:16px;
      color:var(--muted);
      font-size:12px;
      line-height:1.4;
      white-space:pre-wrap;
      word-break:break-word;
      border-top:1px solid var(--line);
      padding-top:12px;
    }
    @media (max-width:680px){
      .grid{grid-template-columns:1fr}
    }
  </style>
</head>
<body>
  <div class="wrap">
    <h1>Property Card</h1>
    <div class="sub">Single property detail page for VaultForge opportunities.</div>

    <div class="actions">
      <a class="btn btn-secondary" href="/members.html">Back to Member Area</a>
      <a class="btn btn-secondary" href="/property-cards.html">Back to Listings</a>
      <a id="editBtn" class="btn btn-blue" href="#">Edit Listing</a>
      <button id="deleteBtn" class="btn btn-danger" type="button">Delete Listing</button>
    </div>

    <div class="notice info">This page loads the property by the <code>?id=</code> in the URL.</div>
    <div id="errorNotice" class="notice error"></div>

    <div class="panel">
      <div id="cover" class="cover"></div>

      <div id="statusBadge" class="eyebrow">Loading…</div>
      <h2 id="title" style="margin:0 0 10px;font-size:32px;line-height:1.1;">Loading property…</h2>
      <div id="location" class="location">Please wait…</div>

      <div class="grid">
        <div class="box">
          <div class="label">Market</div>
          <div id="market" class="value">—</div>
        </div>
        <div class="box">
          <div class="label">Asking Price</div>
          <div id="asking_price" class="value">—</div>
        </div>
        <div class="box">
          <div class="label">Visibility</div>
          <div id="visibility" class="value">—</div>
        </div>
        <div class="box">
          <div class="label">Member</div>
          <div id="member" class="value">—</div>
        </div>
      </div>

      <div class="section">
        <div class="section-title">Summary</div>
        <div id="summary" class="copy">—</div>
      </div>

      <div class="section">
        <div class="section-title">Description</div>
        <div id="description" class="copy">—</div>
      </div>

      <div id="debugLog" class="debug">Page ready.</div>
    </div>
  </div>

  <script>
    const SUPABASE_URL = 'https://mnwwvpuxrzostrplfgmq.supabase.co';
    const SUPABASE_ANON_KEY = 'sb_publishable_sXXlF9GsNcVYnr2BxABAwg_T-BV19qJ';

    const errorNotice = document.getElementById('errorNotice');
    const debugLog = document.getElementById('debugLog');
    const params = new URLSearchParams(window.location.search);
    const propertyId = params.get('id');

    function logDebug(message) {
      const stamp = new Date().toLocaleTimeString();
      debugLog.textContent = '[' + stamp + '] ' + message;
    }

    function showError(message) {
      errorNotice.textContent = message;
      errorNotice.classList.add('show');
      logDebug('ERROR: ' + message);
    }

    function money(value) {
      if (value === null || value === undefined || value === '') return '—';
      const num = Number(value);
      if (Number.isNaN(num)) return value;
      return new Intl.NumberFormat('en-US', {
        style: 'currency',
        currency: 'USD',
        maximumFractionDigits: 0
      }).format(num);
    }

    function text(value, fallback='—') {
      return value === null || value === undefined || value === '' ? fallback : value;
    }

    function setText(id, value, fallback='—') {
      document.getElementById(id).textContent = text(value, fallback);
    }

    function fillCard(row) {
      document.getElementById('statusBadge').textContent = text(row.status, 'Active');
      document.getElementById('title').textContent = text(row.title, 'Untitled Property');
      document.getElementById('location').textContent =
        [row.city, row.state].filter(Boolean).join(', ') || text(row.market, 'Location pending');

      setText('market', row.market);
      document.getElementById('asking_price').textContent = money(row.asking_price);
      setText('visibility', row.visibility);
      setText('member', row.member_name || row.member_email);
      setText('summary', row.summary, 'No summary provided.');
      setText('description', row.description, 'No description provided.');

      document.getElementById('editBtn').href = '/property-edit.html?id=' + encodeURIComponent(row.id);

      if (row.cover_image_url) {
        const cover = document.getElementById('cover');
        cover.style.backgroundImage = "url('" + String(row.cover_image_url).replaceAll("'", "%27") + "')";
        cover.classList.add('show');
      }

      logDebug('Property loaded: ' + row.id);
    }

    async function loadProperty() {
      if (!propertyId) {
        showError('Missing property id in URL.');
        return;
      }

      logDebug('Loading property id ' + propertyId);

      try {
        const url = SUPABASE_URL + '/rest/v1/property_cards?id=eq.' + encodeURIComponent(propertyId) + '&select=*';
        const response = await fetch(url, {
          headers: {
            'apikey': SUPABASE_ANON_KEY,
            'Authorization': 'Bearer ' + SUPABASE_ANON_KEY,
            'Content-Type': 'application/json'
          }
        });

        const rawText = await response.text();
        let parsed;
        try { parsed = rawText ? JSON.parse(rawText) : null; } catch (e) { parsed = rawText; }

        if (!response.ok) {
          const detail = typeof parsed === 'string' ? parsed : JSON.stringify(parsed);
          throw new Error(detail || ('HTTP ' + response.status));
        }

        const row = Array.isArray(parsed) ? parsed[0] : null;
        if (!row) {
          showError('Property not found.');
          return;
        }

        fillCard(row);
      } catch (error) {
        showError('Load failed: ' + (error && error.message ? error.message : 'Unknown error'));
      }
    }

    async function deleteProperty() {
      if (!propertyId) {
        showError('Missing property id.');
        return;
      }

      const ok = window.confirm('Delete this listing permanently?');
      if (!ok) return;

      logDebug('Deleting property id ' + propertyId);

      try {
        const response = await fetch(SUPABASE_URL + '/rest/v1/property_cards?id=eq.' + encodeURIComponent(propertyId), {
          method: 'DELETE',
          headers: {
            'apikey': SUPABASE_ANON_KEY,
            'Authorization': 'Bearer ' + SUPABASE_ANON_KEY,
            'Content-Type': 'application/json'
          }
        });

        const rawText = await response.text();

        if (!response.ok) {
          throw new Error(rawText || ('HTTP ' + response.status));
        }

        logDebug('Delete succeeded. Redirecting.');
        window.location.href = '/property-cards.html?deleted=1';
      } catch (error) {
        showError('Delete failed: ' + (error && error.message ? error.message : 'Unknown error'));
      }
    }

    document.getElementById('deleteBtn').addEventListener('click', deleteProperty);

    loadProperty();
  </script>
</body>
</html>
