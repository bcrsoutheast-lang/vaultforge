<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>VaultForge Property Card</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="/auth.js"></script>

<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:Arial,Helvetica,sans-serif;background:linear-gradient(180deg,#02122e,#041a44,#02122e);color:#fff;padding:18px}
.wrap{max-width:900px;margin:auto}
.top{display:flex;gap:12px;flex-wrap:wrap;margin-bottom:20px}
.btn{background:#1d3f8f;color:#fff;border:none;padding:12px 18px;border-radius:14px;font-weight:700;cursor:pointer}
.btn.gold{background:#caa245;color:#111}
.filters{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin-bottom:18px}
select{width:100%;padding:12px;border-radius:12px;border:1px solid rgba(255,255,255,.18);background:#0d234f;color:#fff}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-bottom:20px}
.stat{background:rgba(255,255,255,.06);padding:18px;border-radius:18px;border:1px solid rgba(255,255,255,.08)}
.stat .num{font-size:34px;font-weight:800;margin-bottom:8px}
.grid{display:grid;grid-template-columns:1fr;gap:16px}
.card{background:rgba(255,255,255,.05);border:1px solid rgba(255,255,255,.09);border-radius:24px;padding:18px;overflow:hidden}
.photo{width:100%;height:220px;border-radius:18px;object-fit:cover;background:#0b1d42;margin-bottom:14px}
.row{display:flex;justify-content:space-between;gap:10px;align-items:flex-start;margin-bottom:10px}
.title{font-size:30px;font-weight:800}
.price{background:rgba(202,162,69,.18);color:#f7df9a;padding:14px 20px;border-radius:999px;font-size:20px;font-weight:800}
.badges{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px}
.badge{padding:10px 14px;border-radius:999px;background:#102a59;border:1px solid rgba(255,255,255,.08);font-weight:700;font-size:14px}
.desc{opacity:.92;line-height:1.45;margin-bottom:14px;font-size:17px}
.actions{display:flex;gap:10px;flex-wrap:wrap}
.small{padding:10px 14px;border:none;border-radius:14px;font-weight:800;cursor:pointer}
.edit{background:#1ec97a;color:#041b12}
.del{background:#ff6a7d;color:#fff}
.empty{padding:28px;text-align:center;background:rgba(255,255,255,.04);border-radius:20px}
</style>
</head>
<body>
<div class="wrap">

<div class="top">
<button class="btn" onclick="location.href='members.html'">Member Dashboard</button>
<button class="btn gold" onclick="location.href='property-create.html'">Create Listing</button>
</div>

<div class="filters">
<select id="stateFilter"><option value="">All States</option><option>Georgia</option><option>Tennessee</option><option>Florida</option></select>
<select id="typeFilter"><option value="">All Types</option><option>Residential</option><option>Commercial</option><option>Land</option></select>
</div>

<div class="stats">
<div class="stat"><div class="num" id="totalNum">0</div><div>Total Listings</div></div>
<div class="stat"><div class="num" id="mineNum">0</div><div>Your Listings</div></div>
<div class="stat"><div class="num" id="visibleNum">0</div><div>Visible After Filters</div></div>
</div>

<div id="grid" class="grid"></div>
</div>

<script>
const sb = window.VaultForgeAuth?.supabase || window.supabase.createClient(
"https://mnwwvpuxrzostrplfgmq.supabase.co",
"sb_publishable_sXXlF9GsNcVYnr2BxABAwg_T-BV19qJ"
);

let currentUser=null;

function money(v){return "$"+Number(v||0).toLocaleString();}

async function init(){
try{
const session = await window.VaultForgeAuth?.getSession?.();
currentUser = session?.user || null;
}catch(e){}
document.getElementById("stateFilter").onchange=loadListings;
document.getElementById("typeFilter").onchange=loadListings;
loadListings();
}

async function loadListings(){
let query=sb.from("property_cards").select("*").order("created_at",{ascending:false});
const state=document.getElementById("stateFilter").value;
const type=document.getElementById("typeFilter").value;
if(state) query=query.eq("state",state);
if(type) query=query.eq("property_type",type);
const {data,error}=await query;
if(error){
document.getElementById("grid").innerHTML='<div class="empty">'+error.message+'</div>';
return;
}
render(data||[]);
}

async function render(rows){
document.getElementById("visibleNum").textContent=rows.length;
const {count}=await sb.from("property_cards").select("*",{count:"exact",head:true});
document.getElementById("totalNum").textContent=count||0;

if(currentUser){
const {count:mine}=await sb.from("property_cards").select("*",{count:"exact",head:true}).eq("user_id",currentUser.id);
document.getElementById("mineNum").textContent=mine||0;
}

const grid=document.getElementById("grid");
if(!rows.length){grid.innerHTML='<div class="empty">No listings found.</div>';return;}

grid.innerHTML=rows.map(r=>{
let photo=(r.photo_urls&&r.photo_urls[0])||r.image_url||"";
return `
<div class="card">
${photo?`<img class="photo" src="${photo}">`:''}
<div class="row">
<div class="title">${r.title||'Untitled'}</div>
<div class="price">${money(r.price||r.asking_price)}</div>
</div>
<div class="badges">
<div class="badge">${r.state||'-'}</div>
<div class="badge">${r.property_type||'-'}</div>
<div class="badge">${r.status||'Live'}</div>
</div>
<div class="desc">${r.description||r.summary||''}</div>
<div class="actions">
<button class="small edit" onclick="location.href='property-create.html?id=${r.id}'">Edit</button>
<button class="small del" onclick="delRow('${r.id}')">Delete</button>
</div>
</div>`;
}).join('');
}

async function delRow(id){
if(!confirm("Delete listing?")) return;
await sb.from("property_cards").delete().eq("id",id);
loadListings();
}

init();
</script>
</body>
</html>
