<!DOCTYPE html>
<html><head><meta charset='utf-8'><meta name='viewport' content='width=device-width,initial-scale=1'>
<title>VaultForge Inline Fix</title>
<style>body{font-family:Arial;background:#0b1020;color:#fff;padding:20px}button{display:block;width:100%;padding:14px;margin:10px 0;font-size:18px}#box{max-width:700px;margin:auto}input,textarea{width:100%;padding:10px;margin:8px 0}</style>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body><div id='box'>
<h1>Property Create Inline Fix</h1>
<div>Version: INLINE-FIX-1</div>
<div id='status'>Ready</div>
<input id='title' value='Test Deal'>
<input id='city' value='Miami'>
<input id='state' value='FL'>
<textarea id='summary'>Test summary</textarea>
<button onclick='testTap()'>Test Tap</button>
<button onclick='testRead()'>Test Supabase Read</button>
<button onclick='saveRow()'>Save Test Row</button>
<script>
let taps=0;
const supabase=window.supabase.createClient("https://mnwwvpuxrzostrplfgmq.supabase.co","sb_publishable_sXXlF9GsNcVYnr2BxABAwg_T-BV19qJ");
function setStatus(t){document.getElementById('status').innerText=t;}
function testTap(){taps++; setStatus("Tap works: "+taps); alert("Tap works "+taps);}
async function testRead(){
 try{
 let r=await supabase.from('property_cards').select('id,title').limit(1);
 if(r.error) throw r.error;
 setStatus("Read passed"); alert("Read passed");
 }catch(e){setStatus("Read failed "+e.message); alert("Read failed: "+e.message);}
}
async function saveRow(){
 try{
 let payload={title:document.getElementById('title').value,city:document.getElementById('city').value,state:document.getElementById('state').value,summary:document.getElementById('summary').value,status:'active',visibility:'members',published_at:new Date().toISOString()};
 let r=await supabase.from('property_cards').insert([payload]);
 if(r.error) throw r.error;
 setStatus("Save passed"); alert("Save passed");
 }catch(e){setStatus("Save failed "+e.message); alert("Save failed: "+e.message);}
}
</script></div></body></html>
