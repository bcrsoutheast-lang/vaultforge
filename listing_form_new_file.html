<!doctype html><html><head><meta charset='utf-8'><meta name='viewport' content='width=device-width,initial-scale=1'><title>Listing Form</title><script src='https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2'></script><style>body{background:#07122a;color:#fff;font-family:Arial;padding:20px}.wrap{max-width:900px;margin:auto}.card{background:#0c1b3a;padding:20px;border-radius:14px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}input,textarea,select{width:100%;padding:12px;border-radius:12px;border:1px solid #2b477d;background:#09153f;color:#fff}textarea{min-height:120px}.row{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px}button,a{padding:12px 16px;border-radius:12px;border:none;cursor:pointer;font:inherit;text-decoration:none}.gold{background:#d6ab4e;color:#111}.dark{background:#12264f;color:#fff;border:1px solid #2b477d}.muted{color:#c9d5ef}</style></head><body><div class='wrap'><div class='card'><div class='row'><a class='dark' href='/admin.html'>Back to Admin</a><a class='dark' id='viewBtn' href='#' style='display:none'>View Listing</a></div><h1 id='mode'>Create Listing</h1><div class='grid'><div><div>Title</div><input id='title'></div><div><div>State</div><input id='state'></div><div><div>City</div><input id='city'></div><div><div>Price</div><input id='price'></div><div><div>Property Type</div><input id='property_type'></div><div><div>Status</div><select id='status'><option>Draft</option><option>Active</option></select></div><div style='grid-column:1/-1'><div>Description</div><textarea id='description'></textarea></div></div><div class='row' style='margin-top:16px'><button class='gold' onclick='save()'>Save</button><div id='statusBox' class='muted'>Ready.</div></div></div></div><script>
const sb=supabase.createClient('https://mnwwvpuxrzostrplfgmq.supabase.co','sb_publishable_sXXlF9GsNcVYnr2BxABAwg_T-BV19qJ');
const editId=new URLSearchParams(location.search).get('edit');
function set(t){document.getElementById('statusBox').textContent=t}
function g(id){return document.getElementById(id)} function setv(id,v){g(id).value=v||''}
async function load(){ if(!editId) return; g('mode').textContent='Edit Listing'; g('viewBtn').style.display='inline-block'; g('viewBtn').href='/listing.html?id='+encodeURIComponent(editId); const r=await sb.from('property_cards').select('*').eq('id',editId).maybeSingle(); if(r.error||!r.data){set('Could not load listing');return} const d=r.data; ['title','state','city','price','property_type','status','description'].forEach(k=>setv(k,d[k])); set('Edit mode ready.');}
async function save(){ const payload={title:g('title').value,state:g('state').value,city:g('city').value,price:g('price').value,property_type:g('property_type').value,status:g('status').value,description:g('description').value}; set('Saving...'); if(editId){ const r=await sb.from('property_cards').update(payload).eq('id',editId).select().maybeSingle(); if(r.error){set(r.error.message);return} location.href='/listing.html?id='+encodeURIComponent(editId);} else { const r=await sb.from('property_cards').insert([payload]).select().maybeSingle(); if(r.error){set(r.error.message);return} location.href='/listing.html?id='+encodeURIComponent(r.data.id);} }
load();
</script></body></html>
