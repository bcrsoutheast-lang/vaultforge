<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>VaultForge Edit Property</title>
  <style>
    :root{
      --bg:#08132f;
      --panel:#0d1b45;
      --text:#eef3ff;
      --muted:#9fb0da;
      --line:rgba(255,255,255,.12);
      --accent:#7ee0b7;
      --accent2:#7ab8ff;
      --danger:#d96b6b;
    }
    *{box-sizing:border-box}
    body{
      margin:0;
      font-family:Arial, Helvetica, sans-serif;
      background:linear-gradient(180deg,#05102a 0%, #08132f 100%);
      color:var(--text);
      min-height:100vh;
    }
    .wrap{
      max-width:840px;
      margin:0 auto;
      padding:24px 18px 48px;
    }
    h1{
      margin:0 0 8px;
      font-size:clamp(30px,4vw,42px);
      line-height:1.05;
    }
    .sub{
      color:var(--muted);
      font-size:15px;
      line-height:1.45;
      margin-bottom:18px;
    }
    .actions{
      display:flex;
      gap:10px;
      flex-wrap:wrap;
      margin-bottom:18px;
    }
    .btn{
      min-height:48px;
      padding:12px 18px;
      border-radius:14px;
      border:1px solid transparent;
      text-decoration:none;
      font-weight:800;
      display:inline-flex;
      align-items:center;
      justify-content:center;
      cursor:pointer;
      font-size:16px;
      background:transparent;
      color:var(--text);
    }
    .btn-primary{background:var(--accent);color:#071325}
    .btn-secondary{border-color:var(--line)}
    .btn-blue{background:var(--accent2);color:#071325}
    .panel{
      background:rgba(255,255,255,.03);
      border:1px solid var(--line);
      border-radius:22px;
      padding:20px;
      box-shadow:0 14px 40px rgba(0,0,0,.18);
    }
    .notice{
      display:none;
      margin-bottom:16px;
      border-radius:14px;
      padding:14px 16px;
      font-weight:700;
      line-height:1.4;
      word-break:break-word;
    }
    .notice.show{display:block}
    .notice.error{
      background:rgba(217,107,107,.12);
      border:1px solid rgba(217,107,107,.35);
      color:#ffd4d4;
    }
    .notice.success{
      background:rgba(126,224,183,.12);
      border:1px solid rgba(126,224,183,.35);
      color:#bdf3dd;
    }
    .notice.info{
      display:block;
      background:rgba(255,255,255,.04);
      border:1px solid var(--line);
      color:#dfe7ff;
    }
    form{
      display:grid;
      grid-template-columns:1fr;
      gap:14px;
    }
    .row{
      display:grid;
      grid-template-columns:1fr 1fr;
      gap:14px;
    }
    .field{
      display:flex;
      flex-direction:column;
      gap:8px;
    }
    label{
      font-size:14px;
      font-weight:800;
      color:#dfe8ff;
    }
    input,select,textarea{
      width:100%;
      min-height:52px;
      border-radius:14px;
      border:1px solid var(--line);
      background:rgba(255,255,255,.03);
      color:var(--text);
      padding:12px 14px;
      font-size:16px;
      outline:none;
    }
    textarea{
      min-height:120px;
      resize:vertical;
    }
    select option{color:#111}
    .required{color:#9ff0cc}
    .debug{
      margin-top:16px;
      color:var(--muted);
      font-size:12px;
      line-height:1.4;
      white-space:pre-wrap;
      word-break:break-word;
      border-top:1px solid var(--line);
      padding-top:12px;
    }
    @media (max-width:640px){
      .row{grid-template-columns:1fr}
    }
  </style>
</head>
<body>
  <div class="wrap">
    <h1>Edit Property</h1>
    <div class="sub">Update the saved property listing and write changes back to Supabase.</div>

    <div class="actions">
      <a class="btn btn-secondary" href="/members.html">Back to Member Area</a>
      <a class="btn btn-secondary" href="/property-cards.html">Back to Listings</a>
      <a id="viewBtn" class="btn btn-blue" href="#">View Property Card</a>
    </div>

    <div class="notice info">This page loads the property by the <code>?id=</code> in the URL, fills the form, and updates the same row.</div>
    <div id="errorNotice" class="notice error"></div>
    <div id="successNotice" class="notice success">Property updated successfully. Redirecting now…</div>

    <div class="panel">
      <form id="editForm" novalidate>
        <div class="field">
          <label for="title">Property Name / Title <span class="required">*</span></label>
          <input id="title" type="text" placeholder="Sunrise Multifamily Portfolio" />
        </div>

        <div class="row">
          <div class="field">
            <label for="city">City</label>
            <input id="city" type="text" placeholder="Dallas" />
          </div>
          <div class="field">
            <label for="state">State</label>
            <input id="state" type="text" placeholder="TX" />
          </div>
        </div>

        <div class="field">
          <label for="market">Market</label>
          <input id="market" type="text" placeholder="DFW / North Texas" />
        </div>

        <div class="field">
          <label for="summary">Summary</label>
          <textarea id="summary" placeholder="Short summary for card preview and listing page."></textarea>
        </div>

        <div class="field">
          <label for="description">Description</label>
          <textarea id="description" placeholder="Full property description and details."></textarea>
        </div>

        <div class="row">
          <div class="field">
            <label for="asking_price">Asking Price</label>
            <input id="asking_price" type="number" step="any" placeholder="12500000" />
          </div>
          <div class="field">
            <label for="status">Status</label>
            <select id="status">
              <option value="Active">Active</option>
              <option value="Open">Open</option>
              <option value="Pending">Pending</option>
              <option value="Off Market">Off Market</option>
              <option value="Closed">Closed</option>
              <option value="Draft">Draft</option>
            </select>
          </div>
        </div>

        <div class="field">
          <label for="visibility">Visibility</label>
          <select id="visibility">
            <option value="members">members</option>
            <option value="private">private</option>
            <option value="public">public</option>
          </select>
        </div>

        <div class="actions" style="margin:6px 0 0;">
          <button id="saveBtn" class="btn btn-primary" type="submit">Save Changes</button>
          <button id="resetBtn" class="btn btn-secondary" type="button">Reset</button>
        </div>
      </form>

      <div id="debugLog" class="debug">Page ready.</div>
    </div>
  </div>

  <script>
    const SUPABASE_URL = 'https://mnwwvpuxrzostrplfgmq.supabase.co';
    const SUPABASE_ANON_KEY = 'sb_publishable_sXXlF9GsNcVYnr2BxABAwg_T-BV19qJ';

    const params = new URLSearchParams(window.location.search);
    const propertyId = params.get('id');

    const form = document.getElementById('editForm');
    const saveBtn = document.getElementById('saveBtn');
    const resetBtn = document.getElementById('resetBtn');
    const errorNotice = document.getElementById('errorNotice');
    const successNotice = document.getElementById('successNotice');
    const debugLog = document.getElementById('debugLog');
    const viewBtn = document.getElementById('viewBtn');

    let originalRow = null;

    function logDebug(message) {
      const stamp = new Date().toLocaleTimeString();
      debugLog.textContent = '[' + stamp + '] ' + message;
    }

    function showError(message) {
      errorNotice.textContent = message;
      errorNotice.classList.add('show');
      successNotice.classList.remove('show');
      logDebug('ERROR: ' + message);
      window.scrollTo({ top: 0, behavior: 'smooth' });
    }

    function clearError() {
      errorNotice.textContent = '';
      errorNotice.classList.remove('show');
    }

    function setSaving(isSaving) {
      saveBtn.disabled = isSaving;
      saveBtn.textContent = isSaving ? 'Saving...' : 'Save Changes';
      logDebug(isSaving ? 'Saving property...' : 'Ready.');
    }

    function value(id) {
      const el = document.getElementById(id);
      return el ? el.value.trim() : '';
    }

    function setValue(id, val) {
      const el = document.getElementById(id);
      if (el) el.value = val == null ? '' : val;
    }

    function fillForm(row) {
      originalRow = row;
      setValue('title', row.title);
      setValue('city', row.city);
      setValue('state', row.state);
      setValue('market', row.market);
      setValue('summary', row.summary);
      setValue('description', row.description);
      setValue('asking_price', row.asking_price);
      setValue('status', row.status || 'Active');
      setValue('visibility', row.visibility || 'members');
      viewBtn.href = '/property-card.html?id=' + encodeURIComponent(row.id);
      logDebug('Property loaded into form: ' + row.id);
    }

    function resetForm() {
      if (!originalRow) return;
      fillForm(originalRow);
      clearError();
      successNotice.classList.remove('show');
      logDebug('Form reset.');
    }

    async function loadProperty() {
      if (!propertyId) {
        showError('Missing property id in URL.');
        return;
      }

      viewBtn.href = '/property-card.html?id=' + encodeURIComponent(propertyId);
      logDebug('Loading property id ' + propertyId);

      try {
        const url = SUPABASE_URL + '/rest/v1/property_cards?id=eq.' + encodeURIComponent(propertyId) + '&select=*';
        const response = await fetch(url, {
          headers: {
            'apikey': SUPABASE_ANON_KEY,
            'Authorization': 'Bearer ' + SUPABASE_ANON_KEY,
            'Content-Type': 'application/json'
          }
        });

        const rawText = await response.text();
        let parsed;
        try { parsed = rawText ? JSON.parse(rawText) : null; } catch (e) { parsed = rawText; }

        if (!response.ok) {
          const detail = typeof parsed === 'string' ? parsed : JSON.stringify(parsed);
          throw new Error(detail || ('HTTP ' + response.status));
        }

        const row = Array.isArray(parsed) ? parsed[0] : null;
        if (!row) {
          showError('Property not found.');
          return;
        }

        fillForm(row);
      } catch (error) {
        showError('Load failed: ' + (error && error.message ? error.message : 'Unknown error'));
      }
    }

    async function saveProperty(event) {
      event.preventDefault();
      clearError();

      if (!propertyId) {
        showError('Missing property id.');
        return;
      }

      const payload = {
        title: value('title'),
        city: value('city') || null,
        state: value('state') || null,
        market: value('market') || null,
        summary: value('summary') || null,
        description: value('description') || null,
        asking_price: value('asking_price') || null,
        status: value('status') || 'Active',
        visibility: value('visibility') || 'members'
      };

      if (!payload.title) {
        showError('Property title is required.');
        return;
      }

      setSaving(true);

      try {
        const response = await fetch(SUPABASE_URL + '/rest/v1/property_cards?id=eq.' + encodeURIComponent(propertyId), {
          method: 'PATCH',
          headers: {
            'apikey': SUPABASE_ANON_KEY,
            'Authorization': 'Bearer ' + SUPABASE_ANON_KEY,
            'Content-Type': 'application/json',
            'Prefer': 'return=representation'
          },
          body: JSON.stringify(payload)
        });

        const rawText = await response.text();
        let parsed;
        try { parsed = rawText ? JSON.parse(rawText) : null; } catch (e) { parsed = rawText; }

        if (!response.ok) {
          const detail = typeof parsed === 'string' ? parsed : JSON.stringify(parsed);
          throw new Error(detail || ('HTTP ' + response.status));
        }

        const row = Array.isArray(parsed) ? parsed[0] : null;
        if (row) originalRow = row;

        successNotice.classList.add('show');
        logDebug('Update succeeded. Redirecting.');
        setTimeout(() => {
          window.location.href = '/property-card.html?id=' + encodeURIComponent(propertyId);
        }, 700);
      } catch (error) {
        showError('Update failed: ' + (error && error.message ? error.message : 'Unknown error'));
      } finally {
        setSaving(false);
      }
    }

    form.addEventListener('submit', saveProperty);
    resetBtn.addEventListener('click', resetForm);

    loadProperty();
  </script>
</body>
</html>
