<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>VaultForge Partner Profile</title>
<style>
:root{
--bg:#08101f;--panel:#121b39;--line:rgba(255,255,255,.08);
--text:#f5f7ff;--muted:#b4bfd9;--gold:#d6b35f;--gold2:#f1d28a;
}
*{box-sizing:border-box}
body{
margin:0;
font-family:Arial,sans-serif;
color:var(--text);
background:linear-gradient(180deg,#07101e 0%,#08101f 100%);
}
.container{
width:min(1000px,calc(100% - 24px));
margin:auto;
padding:28px 0 40px;
}
.top{
display:flex;
justify-content:space-between;
align-items:center;
gap:12px;
flex-wrap:wrap;
margin-bottom:18px;
}
.brand{
font-weight:700;
letter-spacing:.08em;
text-transform:uppercase;
color:var(--gold2);
}
.btn{
padding:12px 16px;
border-radius:999px;
border:1px solid var(--line);
background:rgba(255,255,255,.04);
color:#fff;
text-decoration:none;
font-weight:700;
}
.card{
background:rgba(18,27,57,.95);
border:1px solid var(--line);
border-radius:22px;
padding:24px;
}
.hero{
display:grid;
grid-template-columns:120px 1fr;
gap:20px;
align-items:center;
margin-bottom:22px;
}
.avatar{
width:120px;height:120px;border-radius:22px;
display:grid;place-items:center;
font-size:2rem;font-weight:700;
background:linear-gradient(135deg,rgba(214,179,95,.18),rgba(255,255,255,.03));
border:1px solid rgba(214,179,95,.2);
color:var(--gold2);
}
.name{
font-size:2rem;
font-weight:700;
margin-bottom:6px;
}
.company{
font-size:1.1rem;
color:var(--gold2);
font-weight:700;
margin-bottom:10px;
}
.role{
display:inline-block;
padding:8px 12px;
border-radius:999px;
background:rgba(214,179,95,.12);
border:1px solid rgba(214,179,95,.25);
font-size:.85rem;
font-weight:700;
}
.grid{
display:grid;
grid-template-columns:1fr 1fr;
gap:16px;
margin-top:18px;
}
.box{
background:rgba(255,255,255,.03);
border:1px solid var(--line);
border-radius:18px;
padding:18px;
}
.label{
font-size:.82rem;
letter-spacing:.06em;
text-transform:uppercase;
color:var(--muted);
margin-bottom:8px;
}
.value{
line-height:1.7;
}
.actions{
display:flex;
gap:10px;
flex-wrap:wrap;
margin-top:22px;
}
.action{
padding:12px 16px;
border-radius:999px;
background:rgba(255,255,255,.04);
border:1px solid var(--line);
color:#fff;
text-decoration:none;
font-weight:700;
}
.empty{
text-align:center;
padding:50px 20px;
color:var(--muted);
}
@media(max-width:760px){
.hero{grid-template-columns:1fr;text-align:center}
.avatar{margin:auto}
.grid{grid-template-columns:1fr}
}
</style>
</head>
<body>
<div class="container">

<div class="top">
<div class="brand">VaultForge</div>
<div style="display:flex;gap:10px;flex-wrap:wrap">
<a class="btn" href="/partners.html">Back to Directory</a>
<a class="btn" href="/admin">Admin</a>
</div>
</div>

<div id="profile" class="card">
<div class="empty">Loading partner profile...</div>
</div>

</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
const SUPABASE_URL="https://mnwwvpuxrzostrplfgmq.supabase.co";
const SUPABASE_KEY="sb_publishable_sXXlF9GsNcVYnr2BxABAwg_T-BV19qJ";
const db=window.supabase.createClient(SUPABASE_URL,SUPABASE_KEY);

const profile=document.getElementById("profile");

function esc(v){
return (v||"").toString()
.replace(/&/g,"&amp;")
.replace(/</g,"&lt;")
.replace(/>/g,"&gt;")
.replace(/"/g,"&quot;");
}

function initials(name){
const parts=(name||"U").trim().split(" ");
return (parts[0][0]||"U") + (parts[1]?parts[1][0]:"");
}

async function loadProfile(){
const params=new URLSearchParams(location.search);
const id=params.get("id");

if(!id){
profile.innerHTML='<div class="empty">Missing partner ID.</div>';
return;
}

const {data,error}=await db
.from("partners")
.select("*")
.eq("id",id)
.single();

if(error || !data){
profile.innerHTML='<div class="empty">Partner not found.</div>';
return;
}

render(data);
}

function render(p){
profile.innerHTML=`
<div class="hero">
<div class="avatar">${esc(initials(p.full_name))}</div>

<div>
<div class="name">${esc(p.full_name||"Unnamed")}</div>
<div class="company">${esc(p.company_name||"Independent")}</div>
<div class="role">${esc(p.role||"Partner")}</div>
</div>
</div>

<div class="grid">

<div class="box">
<div class="label">Primary Market</div>
<div class="value">${esc(p.market||"—")}</div>
</div>

<div class="box">
<div class="label">Coverage Area</div>
<div class="value">${esc(p.coverage_area||"—")}</div>
</div>

<div class="box">
<div class="label">Services</div>
<div class="value">${esc(p.services||"—")}</div>
</div>

<div class="box">
<div class="label">Notes</div>
<div class="value">${esc(p.notes||"—")}</div>
</div>

</div>

<div class="actions">
${p.phone?`<a class="action" href="tel:${esc(p.phone)}">Call</a>`:""}
${p.email?`<a class="action" href="mailto:${esc(p.email)}">Email</a>`:""}
${p.website?`<a class="action" href="${esc(p.website)}" target="_blank">Website</a>`:""}
<a class="action" href="mailto:${esc(p.email||'info@vaultforge.com')}?subject=Request Introduction">Request Intro</a>
</div>
`;
}

loadProfile();
</script>
</body>
</html>
