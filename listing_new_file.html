<!doctype html><html><head><meta charset='utf-8'><meta name='viewport' content='width=device-width,initial-scale=1'><title>Listing</title><script src='https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2'></script><style>body{background:#07122a;color:#fff;font-family:Arial;padding:20px}.wrap{max-width:900px;margin:auto}.card{background:#0c1b3a;padding:20px;border-radius:14px}a{color:#fff;text-decoration:none;padding:12px 16px;border-radius:12px;background:#12264f;border:1px solid #2b477d;display:inline-block;margin-right:8px}.muted{color:#c9d5ef}.pill{display:inline-block;padding:8px 12px;border-radius:999px;background:#16315d;margin-right:6px;margin-top:6px}</style></head><body><div class='wrap'><div class='card'><div style='margin-bottom:16px'><a href='/admin.html'>Back to Admin</a><a id='editBtn' href='#'>Edit</a></div><div id='data'>Loading…</div></div></div><script>
const sb=supabase.createClient('https://mnwwvpuxrzostrplfgmq.supabase.co','sb_publishable_sXXlF9GsNcVYnr2BxABAwg_T-BV19qJ');
const id=new URLSearchParams(location.search).get('id'); document.getElementById('editBtn').href='/listing-form.html?edit='+encodeURIComponent(id||'');
(async()=>{ if(!id){document.getElementById('data').textContent='Missing id';return} const r=await sb.from('property_cards').select('*').eq('id',id).maybeSingle(); if(r.error||!r.data){document.getElementById('data').textContent='Listing not found';return} const d=r.data; document.getElementById('data').innerHTML=`<h1>${d.title||'Untitled Listing'}</h1><div><span class='pill'>${d.status||''}</span><span class='pill'>${d.state||''}</span><span class='pill'>${d.city||''}</span><span class='pill'>${d.property_type||''}</span></div><div class='muted' style='margin-top:14px'><b>Price:</b> ${d.price||''}<br><b>User:</b> ${d.user_id||''}<br><b>Description:</b><br>${(d.description||'').replace(/</g,'&lt;')}</div>`; })();
</script></body></html>
