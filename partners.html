<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>VaultForge Partners</title>
<style>
:root{
--bg:#08101f;--panel:#121b39;--line:rgba(255,255,255,.08);
--text:#f5f7ff;--muted:#b4bfd9;--gold:#d6b35f;--gold2:#f1d28a;
}
*{box-sizing:border-box}
body{
margin:0;
font-family:Arial,sans-serif;
color:var(--text);
background:linear-gradient(180deg,#07101e 0%,#08101f 100%);
}
.container{
width:min(1200px,calc(100% - 24px));
margin:auto;
}
.top{
padding:28px 0 16px;
display:flex;
justify-content:space-between;
align-items:center;
gap:16px;
flex-wrap:wrap;
}
.brand{
font-weight:700;
letter-spacing:.08em;
text-transform:uppercase;
color:var(--gold2);
}
h1{
margin:0 0 8px;
font-size:2rem;
}
.sub{
margin:0;
color:var(--muted);
line-height:1.6;
}
.btn{
padding:12px 16px;
border-radius:999px;
border:1px solid var(--line);
background:rgba(255,255,255,.04);
color:#fff;
text-decoration:none;
font-weight:700;
}
.panel{
background:rgba(18,27,57,.95);
border:1px solid var(--line);
border-radius:20px;
padding:18px;
margin-bottom:18px;
}
.controls{
display:grid;
grid-template-columns:2fr 1fr 1fr auto;
gap:12px;
}
input,select{
width:100%;
padding:13px;
border-radius:12px;
border:1px solid rgba(255,255,255,.1);
background:#0b1328;
color:#fff;
}
.grid{
display:grid;
grid-template-columns:repeat(3,minmax(0,1fr));
gap:16px;
padding-bottom:40px;
}
.card{
background:rgba(18,27,57,.95);
border:1px solid var(--line);
border-radius:20px;
padding:18px;
}
.name{
font-size:1.1rem;
font-weight:700;
margin-bottom:6px;
}
.company{
color:var(--gold2);
font-weight:700;
margin-bottom:10px;
}
.meta{
color:var(--muted);
font-size:.95rem;
line-height:1.6;
margin-bottom:10px;
}
.role{
display:inline-block;
padding:7px 10px;
border-radius:999px;
background:rgba(214,179,95,.12);
border:1px solid rgba(214,179,95,.25);
font-size:.82rem;
font-weight:700;
margin-bottom:12px;
}
.actions{
display:flex;
gap:8px;
flex-wrap:wrap;
margin-top:12px;
}
.smallbtn{
padding:10px 12px;
border-radius:999px;
border:1px solid var(--line);
background:rgba(255,255,255,.04);
color:#fff;
text-decoration:none;
font-size:.9rem;
}
.empty{
text-align:center;
padding:40px 20px;
color:var(--muted);
}
@media(max-width:1000px){
.grid{grid-template-columns:repeat(2,minmax(0,1fr));}
.controls{grid-template-columns:1fr 1fr;}
}
@media(max-width:700px){
.grid{grid-template-columns:1fr;}
.controls{grid-template-columns:1fr;}
}
</style>
</head>
<body>
<div class="container">

<div class="top">
<div>
<div class="brand">VaultForge</div>
<h1>Approved Partner Network</h1>
<p class="sub">Private real estate operator directory for approved VaultForge members.</p>
</div>
<a class="btn" href="/admin">Admin</a>
</div>

<div class="panel">
<div class="controls">
<input id="search" placeholder="Search name, company, market, role...">
<select id="roleFilter">
<option value="all">All Roles</option>
</select>
<select id="marketFilter">
<option value="all">All Markets</option>
</select>
<button class="btn" id="refreshBtn">Refresh</button>
</div>
</div>

<div id="results" class="grid">
<div class="empty">Loading partners...</div>
</div>

</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
const SUPABASE_URL="https://mnwwvpuxrzostrplfgmq.supabase.co";
const SUPABASE_KEY="sb_publishable_sXXlF9GsNcVYnr2BxABAwg_T-BV19qJ";
const db=window.supabase.createClient(SUPABASE_URL,SUPABASE_KEY);

const results=document.getElementById("results");
const search=document.getElementById("search");
const roleFilter=document.getElementById("roleFilter");
const marketFilter=document.getElementById("marketFilter");
const refreshBtn=document.getElementById("refreshBtn");

let partners=[];

function safe(v){return (v||"").toString();}
function esc(v){
return safe(v)
.replace(/&/g,"&amp;")
.replace(/</g,"&lt;")
.replace(/>/g,"&gt;")
.replace(/"/g,"&quot;");
}

async function loadPartners(){
results.innerHTML='<div class="empty">Loading partners...</div>';

const {data,error}=await db
.from("partners")
.select("*")
.order("created_at",{ascending:false});

if(error){
results.innerHTML='<div class="empty">Could not load partners.</div>';
return;
}

partners=data||[];
buildFilters();
render();
}

function buildFilters(){
const roles=[...new Set(partners.map(p=>safe(p.role)).filter(Boolean))].sort();
const markets=[...new Set(partners.map(p=>safe(p.market)).filter(Boolean))].sort();

roleFilter.innerHTML='<option value="all">All Roles</option>';
marketFilter.innerHTML='<option value="all">All Markets</option>';

roles.forEach(r=>{
roleFilter.innerHTML+=`<option value="${esc(r)}">${esc(r)}</option>`;
});

markets.forEach(m=>{
marketFilter.innerHTML+=`<option value="${esc(m)}">${esc(m)}</option>`;
});
}

function render(){
const q=search.value.trim().toLowerCase();
const role=roleFilter.value;
const market=marketFilter.value;

const rows=partners.filter(p=>{
const hay=[
p.full_name,p.company_name,p.role,p.market,p.email,p.services,p.coverage_area
].join(" ").toLowerCase();

const matchSearch=!q||hay.includes(q);
const matchRole=role==="all"||safe(p.role)===role;
const matchMarket=market==="all"||safe(p.market)===market;

return matchSearch&&matchRole&&matchMarket;
});

if(!rows.length){
results.innerHTML='<div class="empty">No partners found.</div>';
return;
}

results.innerHTML=rows.map(p=>`
<div class="card">
<div class="name">${esc(p.full_name||"Unnamed")}</div>
<div class="company">${esc(p.company_name||"Independent")}</div>
<div class="role">${esc(p.role||"Partner")}</div>

<div class="meta">
<div><strong>Market:</strong> ${esc(p.market||"—")}</div>
<div><strong>Coverage:</strong> ${esc(p.coverage_area||"—")}</div>
<div><strong>Services:</strong> ${esc(p.services||"—")}</div>
</div>

<div class="actions">
${p.phone?`<a class="smallbtn" href="tel:${esc(p.phone)}">Call</a>`:""}
${p.email?`<a class="smallbtn" href="mailto:${esc(p.email)}">Email</a>`:""}
${p.website?`<a class="smallbtn" href="${esc(p.website)}" target="_blank">Website</a>`:""}
</div>
</div>
`).join("");
}

search.addEventListener("input",render);
roleFilter.addEventListener("change",render);
marketFilter.addEventListener("change",render);
refreshBtn.addEventListener("click",loadPartners);

loadPartners();
</script>
</body>
</html>
