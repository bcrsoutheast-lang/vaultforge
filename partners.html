<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>VaultForge Partners</title>

<style>
:root{
--bg:#08101f;
--panel:#121935;
--panel2:#18213f;
--line:#2a3766;
--text:#f3f6ff;
--muted:#a8b3d1;
--green:#22c55e;
}

*{box-sizing:border-box}

body{
margin:0;
font-family:Inter,Arial,sans-serif;
background:linear-gradient(180deg,#08101f 0%,#0b1020 100%);
color:var(--text);
}

.wrap{
max-width:1380px;
margin:0 auto;
padding:28px 18px 60px;
}

.topbar{
display:flex;
justify-content:space-between;
align-items:center;
gap:16px;
flex-wrap:wrap;
margin-bottom:22px;
}

h1{
margin:0;
font-size:30px;
}

.sub{
color:var(--muted);
margin-top:6px;
}

.topbar a{
text-decoration:none;
color:var(--text);
border:1px solid var(--line);
background:var(--panel);
padding:10px 14px;
border-radius:12px;
}

.controls{
display:grid;
grid-template-columns:1.5fr 1fr 1fr 1fr auto;
gap:12px;
margin-bottom:22px;
}

.field,
.button{
width:100%;
padding:12px 14px;
border-radius:12px;
border:1px solid var(--line);
background:var(--panel);
color:var(--text);
font:inherit;
}

.button{
cursor:pointer;
}

.grid{
display:grid;
grid-template-columns:repeat(3,minmax(0,1fr));
gap:16px;
}

.card{
background:rgba(18,25,53,.92);
border:1px solid var(--line);
border-radius:18px;
padding:18px;
}

.name{
font-size:22px;
font-weight:700;
margin-bottom:4px;
}

.role{
color:#c7d2fe;
font-weight:600;
margin-bottom:14px;
}

.meta{
display:grid;
gap:10px;
margin-bottom:14px;
}

.label{
font-size:12px;
text-transform:uppercase;
letter-spacing:.08em;
color:var(--muted);
margin-bottom:3px;
}

.row{
font-size:15px;
}

.chips{
display:flex;
gap:8px;
flex-wrap:wrap;
margin-bottom:14px;
}

.chip{
padding:6px 10px;
border-radius:999px;
font-size:12px;
border:1px solid var(--line);
background:var(--panel2);
}

.active{
color:#86efac;
}

.empty{
padding:40px;
text-align:center;
color:var(--muted);
background:rgba(18,25,53,.92);
border:1px solid var(--line);
border-radius:18px;
}

@media(max-width:1100px){
.controls{
grid-template-columns:1fr 1fr;
}
.grid{
grid-template-columns:repeat(2,minmax(0,1fr));
}
}

@media(max-width:720px){
.controls,
.grid{
grid-template-columns:1fr;
}
h1{
font-size:24px;
}
}
</style>
</head>

<body>
<div class="wrap">

<div class="topbar">
<div>
<h1>VaultForge Partner Directory</h1>
<div class="sub">Private internal supply-side network</div>
</div>

<a href="/admin">Back to Admin</a>
</div>

<div class="controls">
<input id="searchInput" class="field" placeholder="Search company, contact, email, role, city..." />

<select id="roleFilter" class="field">
<option value="">All roles</option>
</select>

<select id="stateFilter" class="field">
<option value="">All states</option>
</select>

<select id="statusFilter" class="field">
<option value="">All status</option>
<option value="active">Active</option>
<option value="inactive">Inactive</option>
</select>

<button id="clearBtn" class="button">Clear</button>
</div>

<div id="grid" class="grid"></div>

</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script>
const SUPABASE_URL = "YOUR_SUPABASE_URL";
const SUPABASE_ANON_KEY = "YOUR_SUPABASE_ANON_KEY";

const supabaseClient = window.supabase.createClient(
SUPABASE_URL,
SUPABASE_ANON_KEY
);

const els = {
grid: document.getElementById("grid"),
searchInput: document.getElementById("searchInput"),
roleFilter: document.getElementById("roleFilter"),
stateFilter: document.getElementById("stateFilter"),
statusFilter: document.getElementById("statusFilter"),
clearBtn: document.getElementById("clearBtn")
};

let partners = [];

function esc(v){
return String(v ?? "")
.replaceAll("&","&amp;")
.replaceAll("<","&lt;")
.replaceAll(">","&gt;")
.replaceAll('"',"&quot;")
.replaceAll("'","&#039;");
}

function renderFilters(){
const roles = [...new Set(partners.map(x => x.role).filter(Boolean))].sort();
const states = [...new Set(partners.map(x => x.state).filter(Boolean))].sort();

els.roleFilter.innerHTML =
'<option value="">All roles</option>' +
roles.map(x => `<option value="${esc(x)}">${esc(x)}</option>`).join("");

els.stateFilter.innerHTML =
'<option value="">All states</option>' +
states.map(x => `<option value="${esc(x)}">${esc(x)}</option>`).join("");
}

function filtered(){
const q = els.searchInput.value.trim().toLowerCase();
const role = els.roleFilter.value;
const state = els.stateFilter.value;
const status = els.statusFilter.value;

return partners.filter(p => {
const hay =
[
p.company_name,
p.contact_name,
p.email,
p.role,
p.city,
p.state,
p.market,
p.specialties
].join(" ").toLowerCase();

if(q && !hay.includes(q)) return false;
if(role && p.role !== role) return false;
if(state && p.state !== state) return false;
if(status && p.status !== status) return false;

return true;
});
}

function render(){
const rows = filtered();

if(!rows.length){
els.grid.innerHTML = `<div class="empty">No partners found.</div>`;
return;
}

els.grid.innerHTML = rows.map(p => `
<div class="card">

<div class="name">${esc(p.company_name || p.contact_name || "Unnamed")}</div>
<div class="role">${esc(p.role || "Partner")}</div>

<div class="chips">
<span class="chip active">${esc(p.status || "active")}</span>
<span class="chip">${esc(p.city || "")}${p.city && p.state ? ", " : ""}${esc(p.state || "")}</span>
</div>

<div class="meta">

<div>
<div class="label">Contact</div>
<div class="row">${esc(p.contact_name || "—")}</div>
</div>

<div>
<div class="label">Email</div>
<div class="row">${esc(p.email || "—")}</div>
</div>

<div>
<div class="label">Phone</div>
<div class="row">${esc(p.phone || "—")}</div>
</div>

<div>
<div class="label">Market</div>
<div class="row">${esc(p.market || "—")}</div>
</div>

<div>
<div class="label">Specialties</div>
<div class="row">${esc(p.specialties || "—")}</div>
</div>

<div>
<div class="label">Internal Notes</div>
<div class="row">${esc(p.internal_notes || "—")}</div>
</div>

</div>

</div>
`).join("");
}

async function loadPartners(){
const { data, error } = await supabaseClient
.from("partners")
.select("*")
.order("created_at",{ascending:false});

if(error){
els.grid.innerHTML =
`<div class="empty">Failed to load partners.</div>`;
return;
}

partners = data || [];
renderFilters();
render();
}

els.searchInput.addEventListener("input",render);
els.roleFilter.addEventListener("change",render);
els.stateFilter.addEventListener("change",render);
els.statusFilter.addEventListener("change",render);

els.clearBtn.addEventListener("click",() => {
els.searchInput.value = "";
els.roleFilter.value = "";
els.stateFilter.value = "";
els.statusFilter.value = "";
render();
});

loadPartners();
</script>
</body>
</html>
