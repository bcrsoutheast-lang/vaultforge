<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>VaultForge | Listing View</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
:root{
  --bg:#030913; --bg2:#071427; --panel:#08172d; --panel2:#0b1f3f;
  --text:#f6f8ff; --muted:#a7b5d6; --line:rgba(255,255,255,.08);
  --gold:#d6ab4e; --gold2:#f1cf7b; --blue:#3f76ff; --green:#17c37f;
  --red:#df6577; --shadow:0 28px 90px rgba(0,0,0,.42); --radius:28px;
}
*{box-sizing:border-box} html,body{margin:0;padding:0}
body{
  font-family:Arial,Helvetica,sans-serif;color:var(--text);min-height:100vh;overflow-x:hidden;
  background:
    radial-gradient(circle at 12% 10%, rgba(214,171,78,.16), transparent 18%),
    radial-gradient(circle at 86% 12%, rgba(63,118,255,.12), transparent 18%),
    radial-gradient(circle at 50% 100%, rgba(23,195,127,.06), transparent 22%),
    linear-gradient(180deg,var(--bg),var(--bg2));
}
a{text-decoration:none;color:inherit} button,input,textarea{font:inherit}
.shell{max-width:1480px;margin:0 auto;padding:0 16px}
.topbar{position:sticky;top:0;z-index:70;background:rgba(3,9,19,.78);border-bottom:1px solid rgba(255,255,255,.06);backdrop-filter:blur(16px)}
.topbar-inner{display:flex;justify-content:space-between;align-items:center;gap:16px;padding:16px 0;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:14px}
.brand img{width:58px;height:58px;border-radius:18px;object-fit:cover;border:1px solid rgba(214,171,78,.28);box-shadow:var(--shadow)}
.brand-copy strong{display:block;letter-spacing:.18em;color:var(--gold2)}
.brand-copy span{display:block;color:var(--muted);font-size:.95rem}
.nav{display:flex;gap:10px;flex-wrap:wrap}
.btn{appearance:none;border:none;cursor:pointer;border-radius:16px;padding:13px 18px;min-height:50px;font-weight:800;display:inline-flex;align-items:center;justify-content:center;text-align:center;transition:.18s ease}
.btn:hover{transform:translateY(-2px)}
.btn-gold{background:linear-gradient(135deg,var(--gold2),#b5892f);color:#161103}
.btn-blue{background:linear-gradient(135deg,var(--blue),#2758da);color:#fff}
.btn-dark{background:rgba(255,255,255,.035);border:1px solid var(--line);color:#fff}
.btn-red{background:linear-gradient(135deg,var(--red),#cf4f62);color:#fff}
.page{padding:24px 0 38px;display:grid;gap:18px}
.hero{display:grid;grid-template-columns:1.05fr .95fr;gap:18px}
.panel{background:linear-gradient(180deg,var(--panel),var(--panel2));border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow);padding:22px}
.eyebrow{color:var(--gold);text-transform:uppercase;letter-spacing:.18em;font-size:.8rem;font-weight:900;margin-bottom:12px}
h1{margin:0 0 12px;font-size:clamp(2.4rem,5vw,4.4rem);line-height:.92;letter-spacing:-.05em}
.copy{color:var(--muted);line-height:1.7;font-size:1.03rem}
.hero-actions{display:flex;gap:12px;flex-wrap:wrap;margin-top:18px}
.price-box{border:1px solid rgba(214,171,78,.18);border-radius:24px;padding:20px;background:linear-gradient(135deg, rgba(214,171,78,.14), rgba(63,118,255,.08))}
.price-big{font-size:clamp(2.5rem,5vw,4rem);font-weight:900;letter-spacing:-.05em}
.pills{display:flex;gap:8px;flex-wrap:wrap;margin:10px 0 12px}
.pill{padding:8px 12px;border-radius:999px;background:rgba(255,255,255,.04);border:1px solid rgba(255,255,255,.1);font-size:.84rem;font-weight:800}
.pill-live{background:#183c2a;color:#c2f4da}
.gallery{display:grid;grid-template-columns:1fr 180px;gap:12px}
.main-photo{min-height:420px;border-radius:24px;overflow:hidden;border:1px solid rgba(255,255,255,.08);background:#0c1629;display:grid;place-items:center}
.main-photo img{width:100%;height:100%;object-fit:cover;display:block}
.thumb-col{display:grid;gap:12px;align-content:start}
.thumb{height:98px;border-radius:18px;overflow:hidden;border:1px solid rgba(255,255,255,.08);background:#0c1629;cursor:pointer}
.thumb img{width:100%;height:100%;object-fit:cover;display:block}
.grid{display:grid;grid-template-columns:1.1fr .9fr;gap:18px}
.meta-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}
.meta{border:1px solid rgba(255,255,255,.08);border-radius:18px;padding:14px;background:rgba(255,255,255,.02)}
.meta b{display:block;margin-bottom:6px}
.desc-box{border:1px solid rgba(255,255,255,.08);border-radius:22px;padding:18px;background:rgba(255,255,255,.02)}
.list{display:grid;gap:12px}
.list-item{padding:12px 0;border-bottom:1px solid rgba(255,255,255,.06)}
.list-item:last-child{border-bottom:none}
.loading,.error{padding:28px;border-radius:22px;border:1px solid rgba(255,255,255,.08);background:rgba(255,255,255,.02)}
.result-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}
.result-box{border:1px solid rgba(255,255,255,.08);border-radius:18px;padding:14px;background:rgba(255,255,255,.02)}
.result-box strong{display:block;margin-bottom:6px}
.result-list{margin:0;padding-left:18px;color:var(--muted);line-height:1.6}
.result-list li{margin:6px 0}
.offer-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
input,textarea{width:100%;padding:14px 15px;border-radius:16px;border:1px solid rgba(255,255,255,.11);background:#09153f;color:#fff;outline:none}
textarea{min-height:110px;resize:vertical}
.status{margin-top:12px;padding:12px 14px;border-radius:14px;background:rgba(255,255,255,.04);border:1px solid var(--line);font-size:13px;color:#d6e4ff}
.notice-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
.notice{border:1px solid rgba(255,255,255,.08);border-radius:18px;padding:14px;background:rgba(255,255,255,.02)}
.notice strong{display:block;margin-bottom:6px}
.hidden{display:none!important}
@media(max-width:1100px){.hero,.grid,.gallery,.notice-grid{grid-template-columns:1fr}.thumb-col{grid-template-columns:repeat(4,1fr)}}
@media(max-width:700px){.meta-grid,.thumb-col,.result-grid,.offer-grid{grid-template-columns:1fr 1fr}}
@media(max-width:560px){.meta-grid,.thumb-col,.result-grid,.offer-grid{grid-template-columns:1fr}}
</style>
</head>
<body>
<div class="topbar">
  <div class="shell topbar-inner">
    <div class="brand">
      <img src="IMG_2536.png" alt="VaultForge logo">
      <div class="brand-copy">
        <strong>VAULTFORGE</strong>
        <span id="lineText">Premium listing detail</span>
      </div>
    </div>
    <div class="nav">
      <a class="btn btn-dark" href="/property-cards.html">Back to Listings</a>
      <a class="btn btn-blue" id="editBtn" href="#" style="display:none">Edit Listing</a>
      <a class="btn btn-gold" href="/members.html">Dashboard</a>
      <a class="btn btn-dark hidden" href="/admin.html" id="adminBtn">Admin</a>
    </div>
  </div>
</div>

<div class="shell page">
  <div id="stateBox" class="loading">Loading listing...</div>
</div>

<script>
const sb = supabase.createClient('https://mnwwvpuxrzostrplfgmq.supabase.co','sb_publishable_sXXlF9GsNcVYnr2BxABAwg_T-BV19qJ');
const id = new URLSearchParams(location.search).get('id');

function esc(v){return String(v??'').replaceAll('&','&amp;').replaceAll('<','&lt;').replaceAll('>','&gt;').replaceAll('"','&quot;').replaceAll("'",'&#39;');}
function fmtMoney(v){const n=Number(v);return Number.isFinite(n)?new Intl.NumberFormat('en-US',{style:'currency',currency:'USD',maximumFractionDigits:0}).format(n):'—';}
function isLive(status){return ['active','live','approved'].includes(String(status||'').toLowerCase());}
function photosOf(r){const p=r?.photo_urls||r?.image_urls||[];if(Array.isArray(p)) return p.filter(Boolean);try{const j=JSON.parse(p); return Array.isArray(j)?j.filter(Boolean): [];}catch(e){return [];}}
function parseDescription(text){
  const out={main:[],fields:{}};
  String(text||'').split(/\n+/).forEach(line=>{
    const idx=line.indexOf(':');
    if(idx>0){
      const k=line.slice(0,idx).trim();
      const v=line.slice(idx+1).trim();
      out.fields[k]=v;
    } else if(line.trim()){
      out.main.push(line.trim());
    }
  });
  return out;
}
function moneyFromText(v){ const n=Number(String(v||'').replace(/[^0-9.\-]/g,'')); return isNaN(n)?0:n; }
function mainPhotoHtml(photos){
  const first=photos[0];
  if(first) return `<img id="mainImg" src="${esc(first)}" alt="Listing photo">`;
  return `<div class="copy">No photos uploaded.</div>`;
}
function thumbHtml(src, idx){ return `<div class="thumb" onclick="swapPhoto(${idx})"><img src="${esc(src)}" alt="Photo ${idx+1}"></div>`; }
window.swapPhoto=function(idx){ const el=document.getElementById('mainImg'); const arr=window._photos||[]; if(el && arr[idx]) el.src=arr[idx]; }

function analyzeListing(r, parsed){
  const fields = parsed.fields;
  const price = Number(r.price)||0;
  const arv = moneyFromText(fields['ARV']);
  const rehab = moneyFromText(fields['Rehab']);
  const rent = moneyFromText(fields['Rent']);
  const spread = moneyFromText(fields['Cash Flow']) || (arv && price ? arv - price - rehab : 0);
  const type = String(r.property_type||'Residential');
  const status = String(r.status||'Draft');
  const urgency = String(fields['Urgency']||'Normal');
  const buyBucket = String(fields['Buy Bucket']||'Flip');
  const exitStrategy = String(fields['Exit Strategy']||buyBucket||'Flip');
  const seller = String(fields['Seller Motivation']||'Unknown');
  const occupancy = String(fields['Occupancy']||'');
  const notes = [r.title, parsed.main.join(' '), fields['Benefit Tags']||''].join(' ').toLowerCase();

  let score = 58;
  let grade = 'C';
  let speed = '30-60 days';
  let adminPriority = 'Standard';
  let bestMatch = `${type} buyers`;
  let route = `${r.state||'Market'} members + admin`;
  let decision = 'Work';
  let risk = [];
  let moves = [];

  if(type.toLowerCase().includes('land')){ score += 4; bestMatch='Land buyers + builders'; }
  if(type.toLowerCase().includes('commercial')){ score += 6; bestMatch='Commercial buyers + bridge lenders'; }
  if(type.toLowerCase().includes('multi')){ score += 8; bestMatch='Multifamily operators + lenders'; }
  if(type.toLowerCase().includes('res')){ bestMatch='Residential buyers + hard money lenders'; }

  if(isLive(status)){ score += 8; decision = 'Push'; }
  if(urgency.toLowerCase()==='high'){ score += 5; speed='14-30 days'; adminPriority='High'; }
  if(urgency.toLowerCase()==='urgent'){ score += 10; speed='0-14 days'; adminPriority='Immediate'; decision='Push Hard'; }

  if(spread > 0){
    if(spread > 100000){ score += 18; moves.push('Lead with spread and urgency'); }
    else if(spread > 50000){ score += 12; moves.push('Strong value-add story'); }
    else if(spread > 20000){ score += 7; }
    else { risk.push('Thin spread'); score -= 6; }
  } else if(arv && price){
    risk.push('No clear spread after rehab');
    score -= 8;
  } else {
    risk.push('Key valuation data missing');
    moves.push('Get tighter number package');
    score -= 4;
  }

  if(rent){
    moves.push('Position to rental buyers too');
    score += 5;
  }
  if(seller.toLowerCase().includes('distress') || seller.toLowerCase().includes('debt') || seller.toLowerCase().includes('vacant')){
    score += 8;
    adminPriority = adminPriority === 'Immediate' ? 'Immediate' : 'High';
  }
  if(occupancy.toLowerCase().includes('vacant')) risk.push('Vacancy risk');
  if(notes.includes('off market')){ score += 6; route = `${r.state||'Market'} off-market buyers + admin`; }
  if(exitStrategy.toLowerCase().includes('hold')) moves.push('Pitch cash flow and stability');
  if(exitStrategy.toLowerCase().includes('assign') || buyBucket.toLowerCase().includes('wholesale')) moves.push('Blast to cash buyers first');

  score = Math.max(35, Math.min(98, score));
  if(score >= 88) grade='A';
  else if(score >= 75) grade='B';
  else if(score >= 62) grade='C';
  else if(score >= 48) grade='D';
  else grade='F';

  if(score >= 85) decision='Push Hard';
  else if(score >= 70) decision='Push';
  else if(score >= 56) decision='Work';
  else decision='Caution';

  if(!moves.length) moves.push('Get cleaner details and push to targeted buyers');
  if(!risk.length) risk.push('No major flags detected from current input');

  return {
    grade,
    score: `${score}/100`,
    speed,
    adminPriority,
    bestMatch,
    route,
    decision,
    spreadView: spread ? fmtMoney(spread) : 'Needs more data',
    risk: risk.join(' • '),
    moves
  };
}

async function submitInterest(){
  const statusEl = document.getElementById('offerStatus');
  statusEl.textContent = 'Sending...';
  await new Promise(r => setTimeout(r, 350));
  statusEl.textContent = 'Interest captured. Route this through your member/admin workflow next.';
}

async function load(){
  if(!id){
    document.getElementById('stateBox').outerHTML='<div class="error">Missing listing ID.</div>';
    return;
  }
  try{
    const session=(await sb.auth.getSession())?.data?.session, currentUserId=session?.user?.id||null;
    if(session?.user?.email) document.getElementById('lineText').textContent='Logged in as '+session.user.email;

    let isAdminUser = false;
    if(currentUserId){
      const prof=await sb.from('member_profiles').select('role,is_admin').eq('user_id', currentUserId).maybeSingle();
      if(!prof.error && prof.data && (prof.data.role==='admin' || prof.data.is_admin===true)){
        isAdminUser = true;
        document.getElementById('adminBtn').classList.remove('hidden');
      }
    }

    const resp=await sb.from('property_cards').select('*').eq('id',id).maybeSingle();
    if(resp.error || !resp.data){
      document.getElementById('stateBox').outerHTML='<div class="error">Listing not found.</div>';
      return;
    }

    const r=resp.data, photos=photosOf(r), parsed=parseDescription(r.description), isMine=String(r.user_id||'')===String(currentUserId);
    const ai = analyzeListing(r, parsed);
    window._photos=photos;

    if(isMine){
      const editBtn=document.getElementById('editBtn');
      editBtn.style.display='inline-flex';
      editBtn.href='/listing-form.html?edit='+encodeURIComponent(r.id);
    }

    const html = `
      <section class="hero">
        <div class="panel">
          <div class="eyebrow">Premium Listing View</div>
          <h1>${esc(r.title||'Untitled Listing')}</h1>
          <div class="pills">
            <div class="pill ${isLive(r.status)?'pill-live':''}">${esc(r.status||'Draft')}</div>
            <div class="pill">${esc(r.state||'—')}</div>
            <div class="pill">${esc(r.city||'—')}</div>
            <div class="pill">${esc(r.property_type||'—')}</div>
          </div>
          <div class="copy">${esc(parsed.main.join(' ') || 'No summary added yet.')}</div>
          <div class="hero-actions">
            <a class="btn btn-dark" href="/property-cards.html">Back to Listings</a>
            ${isMine?`<a class="btn btn-blue" href="/listing-form.html?edit=${encodeURIComponent(r.id)}">Edit Listing</a>`:''}
            <button class="btn btn-gold" id="needFundingBtn" type="button">Need Funding</button>
            <button class="btn btn-dark" id="needBuyerBtn" type="button">Need Buyer Route</button>
            ${isAdminUser?`<a class="btn btn-dark" href="/admin.html">Admin</a>`:''}
          </div>
        </div>
        <div class="panel">
          <div class="price-box">
            <div class="eyebrow">Money View</div>
            <div class="price-big">${esc(fmtMoney(r.price))}</div>
            <div class="copy">This opportunity is presented in premium format so buyers, lenders, operators, and partners can move faster.</div>
          </div>
          <div class="notice-grid" style="margin-top:14px">
            <div class="notice"><strong>Deal Grade</strong><div class="copy">${esc(ai.grade)}</div></div>
            <div class="notice"><strong>Decision</strong><div class="copy">${esc(ai.decision)}</div></div>
            <div class="notice"><strong>Opportunity Score</strong><div class="copy">${esc(ai.score)}</div></div>
          </div>
        </div>
      </section>

      <section class="panel">
        <div class="eyebrow">Gallery</div>
        <div class="gallery">
          <div class="main-photo">${mainPhotoHtml(photos)}</div>
          <div class="thumb-col">${photos.slice(0,6).map(thumbHtml).join('')}</div>
        </div>
      </section>

      <section class="grid">
        <div class="panel">
          <div class="eyebrow">AI Deal Read</div>
          <div class="result-grid">
            <div class="result-box"><strong>Best Match</strong><div>${esc(ai.bestMatch)}</div></div>
            <div class="result-box"><strong>Likely Route</strong><div>${esc(ai.route)}</div></div>
            <div class="result-box"><strong>Speed to Move</strong><div>${esc(ai.speed)}</div></div>
            <div class="result-box"><strong>Admin Priority</strong><div>${esc(ai.adminPriority)}</div></div>
            <div class="result-box"><strong>Spread View</strong><div>${esc(ai.spreadView)}</div></div>
            <div class="result-box"><strong>Risk Flags</strong><div>${esc(ai.risk)}</div></div>
            <div class="result-box" style="grid-column:1/-1"><strong>Recommended Moves</strong><ul class="result-list">${ai.moves.map(x=>`<li>${esc(x)}</li>`).join('')}</ul></div>
          </div>

          <div style="margin-top:18px" class="desc-box">
            <div class="eyebrow" style="margin-bottom:8px">Opportunity Summary</div>
            <div class="copy">${esc(parsed.main.join(' ') || 'No long summary yet.')}</div>
          </div>

          <div style="margin-top:18px" class="meta-grid">
            <div class="meta"><b>Buy Bucket</b>${esc(parsed.fields['Buy Bucket']||'—')}</div>
            <div class="meta"><b>Exit Strategy</b>${esc(parsed.fields['Exit Strategy']||'—')}</div>
            <div class="meta"><b>Seller Motivation</b>${esc(parsed.fields['Seller Motivation']||'—')}</div>
            <div class="meta"><b>ARV / Exit Value</b>${esc(parsed.fields['ARV']||'—')}</div>
            <div class="meta"><b>Rehab Estimate</b>${esc(parsed.fields['Rehab']||'—')}</div>
            <div class="meta"><b>Rent / NOI</b>${esc(parsed.fields['Rent']||'—')}</div>
            <div class="meta"><b>Cash Flow / Spread</b>${esc(parsed.fields['Cash Flow']||'—')}</div>
            <div class="meta"><b>Cap Rate / ROI</b>${esc(parsed.fields['Cap Rate / ROI']||'—')}</div>
          </div>
        </div>

        <div class="panel">
          <div class="eyebrow">Property Details</div>
          <div class="list">
            <div class="list-item"><b>Bedrooms</b><div class="copy">${esc(parsed.fields['Bedrooms']||'—')}</div></div>
            <div class="list-item"><b>Bathrooms</b><div class="copy">${esc(parsed.fields['Bathrooms']||'—')}</div></div>
            <div class="list-item"><b>Square Feet</b><div class="copy">${esc(parsed.fields['Square Feet']||'—')}</div></div>
            <div class="list-item"><b>Building Size</b><div class="copy">${esc(parsed.fields['Building Size']||'—')}</div></div>
            <div class="list-item"><b>Zoning</b><div class="copy">${esc(parsed.fields['Zoning']||'—')}</div></div>
            <div class="list-item"><b>Occupancy</b><div class="copy">${esc(parsed.fields['Occupancy']||'—')}</div></div>
            <div class="list-item"><b>Acres</b><div class="copy">${esc(parsed.fields['Acres']||'—')}</div></div>
            <div class="list-item"><b>Frontage</b><div class="copy">${esc(parsed.fields['Frontage']||'—')}</div></div>
            <div class="list-item"><b>Utilities</b><div class="copy">${esc(parsed.fields['Utilities']||'—')}</div></div>
            <div class="list-item"><b>Benefit Tags</b><div class="copy">${esc(parsed.fields['Benefit Tags']||'—')}</div></div>
          </div>

          <div style="margin-top:18px" class="desc-box">
            <div class="eyebrow" style="margin-bottom:8px">Take Action</div>
            <div class="offer-grid">
              <div><input id="offerName" placeholder="Your name"></div>
              <div><input id="offerEmail" placeholder="Your email"></div>
              <div><input id="offerPrice" placeholder="Offer price"></div>
              <div><input id="offerTerms" placeholder="Cash / Finance / Close timeline"></div>
              <div style="grid-column:1/-1"><textarea id="offerNotes" placeholder="Why this deal fits you or what you need next."></textarea></div>
            </div>
            <div class="hero-actions">
              <button class="btn btn-gold" id="submitInterestBtn" type="button">Submit Interest</button>
              <button class="btn btn-dark" id="routePainBtn" type="button">Route to Pain Engine</button>
            </div>
            <div class="status" id="offerStatus">Ready.</div>
          </div>
        </div>
      </section>
    `;

    document.getElementById('stateBox').outerHTML = html;

    document.getElementById('submitInterestBtn').addEventListener('click', submitInterest);
    document.getElementById('needFundingBtn').addEventListener('click', () => {
      window.location.href = '/pain.html';
    });
    document.getElementById('needBuyerBtn').addEventListener('click', () => {
      window.location.href = '/pain.html';
    });
    document.getElementById('routePainBtn').addEventListener('click', () => {
      window.location.href = '/pain.html';
    });

  }catch(e){
    document.getElementById('stateBox').outerHTML='<div class="error">'+esc(e.message||'Failed to load listing.')+'</div>';
  }
}
load();
</script>
</body>
</html>
