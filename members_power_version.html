<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>VaultForge | Members Power</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
body{margin:0;font-family:Arial,Helvetica,sans-serif;background:#071427;color:#fff}
.wrap{max-width:1300px;margin:auto;padding:20px}
.top{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
.btn{padding:10px 14px;border:none;border-radius:12px;font-weight:800;cursor:pointer}
.dark{background:#13233f;color:#fff}.gold{background:#d6ab4e;color:#111}.red{background:#c34a5e;color:#fff}.green{background:#1e8f63;color:#fff}.blue{background:#2e63e7;color:#fff}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(320px,1fr));gap:16px;margin-top:18px}
.card{background:#0b1f3f;border:1px solid rgba(255,255,255,.08);border-radius:18px;padding:16px}
.small{font-size:13px;color:#b8c5e6}
h1,h2,h3{margin:0 0 8px}
.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin:18px 0}
.stat{background:#0b1f3f;padding:14px;border-radius:16px;text-align:center}
.stat strong{display:block;font-size:28px}
.notice{padding:12px;border-radius:12px;background:#13233f;margin-top:12px}
</style>
</head>
<body>
<div class="wrap">
  <div class="top">
    <h1>VaultForge Members Power</h1>
    <div class="actions">
      <a href="/listing-form.html"><button class="btn gold">Create Listing</button></a>
      <a href="/property-cards.html"><button class="btn dark">All Listings</button></a>
      <a href="/member-profile.html"><button class="btn dark">Profile</button></a>
    </div>
  </div>

  <div class="stats">
    <div class="stat"><strong id="activeCt">0</strong><span class="small">Active</span></div>
    <div class="stat"><strong id="soldCt">0</strong><span class="small">Sold</span></div>
    <div class="stat"><strong id="pausedCt">0</strong><span class="small">Paused</span></div>
    <div class="stat"><strong id="draftCt">0</strong><span class="small">Draft</span></div>
  </div>

  <div class="notice" id="msg">Loading your listings...</div>

  <h2 style="margin-top:20px">My Listings</h2>
  <div class="grid" id="grid"></div>
</div>

<script>
const sb = supabase.createClient(
'https://mnwwvpuxrzostrplfgmq.supabase.co',
'sb_publishable_sXXlF9GsNcVYnr2BxABAwg_T-BV19qJ'
);

let uid = null;
function msg(t){document.getElementById('msg').textContent=t;}

async function load(){
  const sess = await sb.auth.getSession();
  const s = sess?.data?.session;
  if(!s){ location.href='/member-login.html'; return; }
  uid = s.user.id;

  const res = await sb.from('property_cards')
    .select('*')
    .eq('user_id', uid)
    .order('created_at',{ascending:false});

  if(res.error){ msg(res.error.message); return; }

  const rows = res.data || [];
  renderStats(rows);
  render(rows);
  msg('Manage your listings below.');
}

function renderStats(rows){
  const count = st => rows.filter(r => String(r.status||'draft').toLowerCase()===st).length;
  document.getElementById('activeCt').textContent = count('active');
  document.getElementById('soldCt').textContent = count('sold');
  document.getElementById('pausedCt').textContent = count('paused');
  document.getElementById('draftCt').textContent = count('draft');
}

function render(rows){
  const grid = document.getElementById('grid');
  if(!rows.length){ grid.innerHTML='<div class="card">No listings yet.</div>'; return; }

  grid.innerHTML = rows.map(r => `
    <div class="card">
      <h3>${esc(r.title || 'Untitled')}</h3>
      <div class="small">${esc(r.city || '')} ${esc(r.state || '')}</div>
      <div class="small">Status: <b>${esc(r.status || 'draft')}</b></div>
      <div class="small">Price: ${money(r.price)}</div>

      <div class="actions">
        <a href="/listing.html?id=${r.id}"><button class="btn dark">View</button></a>
        <a href="/listing-form.html?edit=${r.id}"><button class="btn blue">Edit</button></a>
        <button class="btn green" onclick="setStatus('${r.id}','sold')">Sold</button>
        <button class="btn dark" onclick="setStatus('${r.id}','paused')">Pause</button>
        <button class="btn gold" onclick="setStatus('${r.id}','active')">Activate</button>
        <button class="btn red" onclick="removeListing('${r.id}')">Delete</button>
      </div>
    </div>
  `).join('');
}

async function setStatus(id,status){
  msg('Updating...');
  const res = await sb.from('property_cards')
    .update({status:status})
    .eq('id',id)
    .eq('user_id',uid);

  if(res.error){ msg(res.error.message); return; }
  await load();
  msg('Updated to '+status);
}

async function removeListing(id){
  if(!confirm('Delete this listing?')) return;

  msg('Deleting...');
  const res = await sb.from('property_cards')
    .delete()
    .eq('id',id)
    .eq('user_id',uid);

  if(res.error){ msg(res.error.message); return; }
  await load();
  msg('Deleted.');
}

function esc(v){
 return String(v||'')
 .replaceAll('&','&amp;')
 .replaceAll('<','&lt;')
 .replaceAll('>','&gt;');
}

function money(v){
 const n = Number(v);
 if(isNaN(n)) return '—';
 return new Intl.NumberFormat('en-US',{style:'currency',currency:'USD',maximumFractionDigits:0}).format(n);
}

load();
</script>
</body>
</html>
