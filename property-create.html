<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>VaultForge | Property Create Test</title>
  <style>
    body { margin:0; padding:20px; font-family:Arial,sans-serif; background:#0b1020; color:#eef3ff; }
    .box { max-width:760px; margin:0 auto; background:#121a31; border:1px solid rgba(255,255,255,.1); border-radius:16px; padding:24px; }
    input, textarea, button, a.testlink {
      width:100%; padding:14px; margin-top:8px; margin-bottom:16px; border-radius:10px;
      border:1px solid rgba(255,255,255,.15); background:#0f1730; color:#eef3ff; box-sizing:border-box; font-size:16px;
      display:block; text-decoration:none; text-align:center;
    }
    button { background:#8ef0c5; color:#07111d; font-weight:700; cursor:pointer; }
    .muted { color:#a8b4d6; }
    .ok { color:#9df0b7; }
    .bad { color:#ff9a9a; white-space:pre-wrap; }
    code { display:block; white-space:pre-wrap; background:#0f1730; padding:12px; border-radius:10px; border:1px solid rgba(255,255,255,.1); }
  </style>
</head>
<body>
  <div class='box'>
    <h1>VaultForge Property Create Test</h1>
    <p class='muted'>Version: VF-PROP-CREATE-TEST-2026-04-18-C</p>
    <p class='muted'>This version tests taps before Supabase is touched.</p>

    <label>Title</label>
    <input id='title' value='Test Deal'>

    <label>City</label>
    <input id='city' value='Miami'>

    <label>State</label>
    <input id='state' value='FL'>

    <label>Summary</label>
    <textarea id='summary'>Test summary</textarea>

    <a class="testlink" href="/property-cards.html?navtest=1">Navigation Test Link</a>
    <button onclick="testTap()">1. Test Tap</button>
    <button onclick="testRead()">2. Test Supabase Read</button>
    <button onclick="saveRow()">3. Save Test Row</button>

    <h3>Status</h3>
    <div id='status' class='muted'>Ready.</div>

    <h3>Debug</h3>
    <code id='debug'>Waiting...</code>
  </div>

  <script>
    const VERSION = "VF-PROP-CREATE-TEST-2026-04-18-C";
    const SUPABASE_URL = "https://mnwwvpuxrzostrplfgmq.supabase.co";
    const SUPABASE_ANON_KEY = "sb_publishable_sXXlF9GsNcVYnr2BxABAwg_T-BV19qJ";

    let taps = 0;

    function setStatus(msg, ok) {
      const el = document.getElementById('status');
      el.textContent = msg;
      el.className = ok ? 'ok' : 'bad';
    }

    function setDebug(obj) {
      document.getElementById('debug').textContent =
        typeof obj === 'string' ? obj : JSON.stringify(obj, null, 2);
    }

    function testTap() {
      taps += 1;
      setStatus("Tap works: " + taps, true);
      setDebug("Tap handler ran. Version " + VERSION + ". Tap count = " + taps);
      alert("Tap works " + taps);
    }

    function getClient() {
      if (!window.supabase || !window.supabase.createClient) {
        throw new Error("Supabase script did not load from CDN.");
      }
      return window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
    }

    async function testRead() {
      try {
        setStatus("Testing read...", true);
        const supabase = getClient();
        const result = await supabase.from("property_cards").select("id,title,created_at").limit(3);
        if (result.error) throw result.error;
        setStatus("Read test passed.", true);
        setDebug(result.data);
        alert("Read test passed.");
      } catch (err) {
        const msg = [
          err.message || "Unknown read error",
          err.details ? "Details: " + err.details : "",
          err.hint ? "Hint: " + err.hint : "",
          err.code ? "Code: " + err.code : ""
        ].filter(Boolean).join("\n");
        setStatus("Read test failed.", false);
        setDebug(msg);
        alert("Read test failed:\n" + msg);
      }
    }

    async function saveRow() {
      try {
        const payload = {
          title: document.getElementById('title').value.trim(),
          city: document.getElementById('city').value.trim() || null,
          state: document.getElementById('state').value.trim().toUpperCase() || null,
          summary: document.getElementById('summary').value.trim() || null,
          status: 'active',
          visibility: 'members',
          published_at: new Date().toISOString()
        };

        if (!payload.title || payload.title.length < 3) {
          throw new Error("Title must be at least 3 characters.");
        }

        setStatus("Saving row...", true);
        setDebug(payload);

        const supabase = getClient();
        const result = await supabase.from("property_cards").insert([payload]);
        if (result.error) throw result.error;

        setStatus("Save succeeded.", true);
        setDebug("Insert completed successfully.");
        alert("Save succeeded. Now check property-cards.html and Supabase table.");
      } catch (err) {
        const msg = [
          err.message || "Unknown save error",
          err.details ? "Details: " + err.details : "",
          err.hint ? "Hint: " + err.hint : "",
          err.code ? "Code: " + err.code : ""
        ].filter(Boolean).join("\n");
        setStatus("Save failed.", false);
        setDebug(msg);
        alert("Save failed:\n" + msg);
      }
    }

    setDebug("Page JS loaded. Version " + VERSION + ". If Test Tap does nothing, the browser is not running inline JS.");
  </script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</body>
</html>
