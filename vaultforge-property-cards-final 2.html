<script>
const SUPABASE_URL="https://mnwwvpuxrzostrplfgmq.supabase.co";
const SUPABASE_KEY="sb_publishable_sXXlF9GsNcVYnr2BxABAwg_T-BV19qJ";
const STORAGE_BUCKET="vaultforge-media";
const sb=window.VaultForgeAuth&&window.VaultForgeAuth.supabase?window.VaultForgeAuth.supabase:window.supabase.createClient(SUPABASE_URL,SUPABASE_KEY);
function fmtMoney(v){const n=Number(v);if(!Number.isFinite(n))return "—";return new Intl.NumberFormat("en-US",{style:"currency",currency:"USD",maximumFractionDigits:0}).format(n)}
function esc(v){return String(v??"").replaceAll("&","&amp;").replaceAll("<","&lt;").replaceAll(">","&gt;").replaceAll('"',"&quot;").replaceAll("'","&#39;")}
function photosOf(r){const p=r?.photo_urls||r?.image_urls||[];return Array.isArray(p)?p.filter(Boolean):[]}
async function getSessionOrRedirect(){if(window.VaultForgeAuth&&window.VaultForgeAuth.requireLogin)return await window.VaultForgeAuth.requireLogin();const r=await sb.auth.getSession();const s=r?.data?.session;if(!s){window.location.href="/member-login.html";return null}return s}
async function logoutNow(){try{if(window.VaultForgeAuth&&window.VaultForgeAuth.logout){await window.VaultForgeAuth.logout();return}}catch(e){}await sb.auth.signOut();window.location.href="/member-login.html"}
</script>
<style>
:root{--bg:#050c1a;--bg2:#08142d;--panel:#0c1832;--text:#f7f8fc;--muted:#a6b2d1;--line:rgba(255,255,255,.10);--gold:#d6ab4e;--gold2:#f0c96a;--green:#18c37e;--blue:#4f8cff;--danger:#e27d7d;--shadow:0 30px 90px rgba(0,0,0,.42);--radius:26px}
*{box-sizing:border-box}html,body{margin:0;padding:0}body{font-family:Arial,Helvetica,sans-serif;color:var(--text);min-height:100vh;background:radial-gradient(circle at 12% 8%, rgba(214,171,78,.12), transparent 18%),radial-gradient(circle at 88% 12%, rgba(79,140,255,.12), transparent 18%),linear-gradient(180deg,var(--bg),var(--bg2))}
a{text-decoration:none;color:inherit}.shell{width:min(1200px,calc(100% - 28px));margin:0 auto}.hidden{display:none!important}
.topbar{position:sticky;top:0;z-index:50;backdrop-filter:blur(16px);background:rgba(5,12,26,.80);border-bottom:1px solid rgba(255,255,255,.06)}.topbar-inner{display:flex;justify-content:space-between;align-items:center;gap:16px;padding:16px 0;flex-wrap:wrap}.brand{display:flex;align-items:center;gap:14px}.brand-mark{width:58px;height:58px;border-radius:18px;display:grid;place-items:center;background:linear-gradient(135deg, rgba(214,171,78,.22), rgba(255,255,255,.06)),linear-gradient(180deg,#15191f,#0c1018);border:1px solid rgba(214,171,78,.28);box-shadow:var(--shadow);color:var(--gold2);font-weight:900;font-size:1.25rem}.brand-copy strong{display:block;font-size:1.04rem;letter-spacing:.16em;color:var(--gold2)}.brand-copy span{display:block;color:var(--muted);font-size:.95rem}
.top-actions{display:flex;gap:10px;flex-wrap:wrap}.btn{appearance:none;border:none;cursor:pointer;border-radius:16px;padding:13px 18px;min-height:50px;font-weight:800;display:inline-flex;align-items:center;justify-content:center;transition:.18s ease}.btn:hover{transform:translateY(-1px)}.btn-blue{background:linear-gradient(135deg,var(--blue),#2f6bf2);color:#fff}.btn-gold{background:linear-gradient(135deg,var(--gold2),#b7852d);color:#111}.btn-dark{background:rgba(255,255,255,.035);border:1px solid var(--line);color:#fff}.btn-red{background:linear-gradient(135deg,#f16f7d,#d44c5b);color:#fff}.btn-green{background:linear-gradient(135deg,#1dd48a,#10a96d);color:#fff}
.card,.panel{border:1px solid var(--line);border-radius:var(--radius);background:radial-gradient(circle at top right, rgba(214,171,78,.10), transparent 28%),linear-gradient(180deg,var(--panel),#091327);box-shadow:var(--shadow);padding:20px}.grid2{display:grid;grid-template-columns:1fr 1fr;gap:16px}.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:16px}.hero{padding:24px 0 18px}.eyebrow{color:var(--gold);text-transform:uppercase;letter-spacing:.18em;font-size:.8rem;font-weight:900;margin-bottom:12px}.title{margin:0 0 10px;font-size:clamp(2rem,4.6vw,4rem);line-height:.98;letter-spacing:-.05em}.copy{color:var(--muted);line-height:1.65}
.metric strong{display:block;font-size:2rem;margin-bottom:6px}.metric span{color:var(--muted)}.metric{border:1px solid rgba(255,255,255,.08);border-radius:20px;padding:18px;background:rgba(255,255,255,.025)}.section{padding:10px 0 24px}.section-head{display:flex;justify-content:space-between;align-items:flex-end;gap:12px;margin-bottom:18px;flex-wrap:wrap}.section-head h3{margin:0;font-size:1.35rem}.section-head p{margin:6px 0 0;color:var(--muted)}
.pills,.actions{display:flex;gap:10px;flex-wrap:wrap}.pill{border-radius:999px;padding:9px 12px;font-size:.86rem;font-weight:800;background:rgba(255,255,255,.04);border:1px solid rgba(255,255,255,.10);color:#e6eeff}
.item{border:1px solid rgba(255,255,255,.08);border-radius:22px;padding:18px;background:rgba(255,255,255,.02)}.item h4{margin:0 0 8px;font-size:1.18rem}.muted{color:var(--muted)}.price{font-weight:900;font-size:1.1rem;color:#f7e4b9}
label{display:block;font-size:12px;letter-spacing:.10em;text-transform:uppercase;color:var(--muted);font-weight:700;margin:0 0 7px}input,textarea,select{width:100%;padding:13px 14px;border-radius:14px;border:1px solid rgba(255,255,255,.12);background:rgba(255,255,255,.04);color:#fff;outline:none}textarea{min-height:120px;resize:vertical}.row2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.status{margin-top:12px;padding:11px 13px;border-radius:13px;background:rgba(255,255,255,.04);border:1px solid var(--line);font-size:13px;color:#d6e4ff}.ok{color:#aaf2ce}.err{color:#ffc3cc}
.photo-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:12px}.photo{border:1px solid rgba(255,255,255,.1);border-radius:18px;overflow:hidden;background:rgba(255,255,255,.03)}.photo img{width:100%;height:120px;object-fit:cover;display:block}.photo-empty{height:120px;display:flex;align-items:center;justify-content:center;color:var(--muted)}
.modal{position:fixed;inset:0;background:rgba(2,6,14,.72);display:none;align-items:center;justify-content:center;padding:18px;z-index:120}.modal.show{display:flex}.modal-card{width:min(760px,100%);max-height:92vh;overflow:auto}.close{appearance:none;border:none;background:rgba(255,255,255,.05);border:1px solid rgba(255,255,255,.1);color:#fff;min-width:46px;height:46px;border-radius:14px;cursor:pointer}
@media(max-width:900px){.grid2,.grid3,.row2{grid-template-columns:1fr}.top-actions{width:100%}.top-actions .btn{flex:1}}
</style>
</head><body>
<div class="topbar"><div class="shell topbar-inner"><div class="brand"><div class="brand-mark">VF</div><div class="brand-copy"><strong>VAULTFORGE</strong><span id="memberLine">Checking member session...</span></div></div><div class="top-actions"><a class="btn btn-dark" href="/members.html">Member Dashboard</a><a class="btn btn-blue" href="/property-create.html">Create Listing</a><button id="logoutBtn" class="btn btn-dark" type="button">Logout</button></div></div></div>
<main class="shell"><section class="hero"><div class="grid2"><div class="card"><div class="eyebrow">Listings</div><h1 class="title">Live property cards.</h1><p class="copy">This page reads only from <strong>property_cards</strong> and shows rows with status Active, Approved, Live, or blank.</p></div><div class="card"><div class="eyebrow">Filters</div><div class="row2"><div><label for="stateFilter">State</label><select id="stateFilter"><option value="All">All</option><option>Georgia</option><option>Tennessee</option><option>Florida</option></select></div><div><label for="typeFilter">Type</label><select id="typeFilter"><option value="All">All</option><option>Residential</option><option>Commercial</option><option>Land</option></select></div></div><div id="cardsStatus" class="status">Ready.</div></div></div></section><section class="section"><div class="section-head"><div><h3>Listings</h3><p id="listCountText">Loading...</p></div></div><div id="cardsWrap" class="grid2"></div></section></main>
<script>
let rows=[];
function liveRows(list){return(list||[]).filter(r=>{const st=String(r.status||"").toLowerCase();return !st||st==="active"||st==="approved"||st==="live"})}
function setCardsStatus(msg,cls=""){const el=document.getElementById("cardsStatus");el.className="status "+cls;el.textContent=msg}
function render(){const state=document.getElementById("stateFilter").value;const type=document.getElementById("typeFilter").value;let filtered=liveRows(rows);if(state!=="All")filtered=filtered.filter(r=>String(r.state||r.property_state||r.location_state||"").trim()===state);if(type!=="All")filtered=filtered.filter(r=>String(r.property_type||"").trim()===type);document.getElementById("listCountText").textContent=`${filtered.length} listing${filtered.length===1?"":"s"} visible in the current view.`;document.getElementById("cardsWrap").innerHTML=filtered.length?filtered.map(r=>{const title=r.title||"Untitled Listing";const st=String(r.state||r.property_state||r.location_state||"").trim();const ptype=r.property_type||"—";const price=r.price??r.asking_price??r.list_price??null;const desc=r.description||r.summary||r.notes||"";const pics=photosOf(r);return `<article class="item"><h4>${esc(title)}</h4><div class="pills" style="margin-bottom:8px"><div class="pill">${esc(st||"—")}</div><div class="pill">${esc(ptype)}</div><div class="pill">${esc(r.status||"Active")}</div></div><div class="price">${price!=null?esc(fmtMoney(price)):"—"}</div><div class="muted" style="margin:8px 0 12px">${esc(desc||"No description yet.")}</div><div class="photo-grid">${pics.length?pics.slice(0,3).map(u=>`<div class="photo"><img src="${esc(u)}" alt="Photo"></div>`).join(""):`<div class="photo"><div class="photo-empty">No Photo Yet</div></div>`}</div></article>`}).join(""):`<div class="panel">No listings matched this view.</div>`}
(async function boot(){try{setCardsStatus("Loading listings...");const session=await getSessionOrRedirect();if(!session)return;document.getElementById("memberLine").textContent="Logged in as "+(session.user.email||"Member");document.getElementById("logoutBtn").onclick=logoutNow;const params=new URLSearchParams(location.search);const stateQ=params.get("state");if(stateQ)document.getElementById("stateFilter").value=stateQ;const resp=await sb.from("property_cards").select("*").order("created_at",{ascending:false}).limit(300);if(resp.error)throw resp.error;rows=resp.data||[];render();setCardsStatus("Listings ready.","ok");document.getElementById("stateFilter").onchange=render;document.getElementById("typeFilter").onchange=render}catch(e){setCardsStatus(e.message||"Load failed.","err")}})();
</script></body></html>
