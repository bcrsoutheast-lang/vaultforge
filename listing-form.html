<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Listing Form</title>
<style>
body{background:#07122a;color:#fff;font-family:Arial;padding:20px;}
input,select{width:100%;padding:10px;margin:6px 0;}
button{padding:12px;margin-top:10px;}
</style>
</head>

<body>

<h2 id="mode">Create Listing</h2>

<input id="title" placeholder="Title">
<input id="state" placeholder="State">
<input id="city" placeholder="City">
<input id="price" placeholder="Price">
<input id="type" placeholder="Property Type">

<button onclick="save()">Save</button>

<script>
const params = new URLSearchParams(window.location.search);
const editId = params.get("edit");

const URL = "https://mnwwvpuxrzostrplfgmq.supabase.co/rest/v1/property_cards";
const KEY = "sb_publishable_sXXlF9GsNcVYnr2BxABAwg_T-BV19qJ";

if(editId){
document.getElementById("mode").innerText="Edit Listing";
load();
}

async function load(){
const res = await fetch(URL+"?id=eq."+editId,{
headers:{
apikey:KEY,
Authorization:"Bearer "+KEY
}
});
const d = (await res.json())[0];

title.value=d.title||"";
state.value=d.state||"";
city.value=d.city||"";
price.value=d.price||"";
type.value=d.property_type||"";
}

async function save(){

const body={
title:title.value,
state:state.value,
city:city.value,
price:price.value,
property_type:type.value
};

if(editId){
await fetch(URL+"?id=eq."+editId,{
method:"PATCH",
headers:{
apikey:KEY,
Authorization:"Bearer "+KEY,
"Content-Type":"application/json"
},
body:JSON.stringify(body)
});
}else{
await fetch(URL,{
method:"POST",
headers:{
apikey:KEY,
Authorization:"Bearer "+KEY,
"Content-Type":"application/json"
},
body:JSON.stringify(body)
});
}

window.location.href="admin.html";
}
</script>

</body>
</html>
