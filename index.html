<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>VaultForge Diagnostic</title>
  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #08101f;
      color: #f5f7ff;
      padding: 20px;
    }
    .box {
      max-width: 900px;
      margin: 0 auto;
      background: #121b39;
      border: 1px solid rgba(255,255,255,0.08);
      border-radius: 16px;
      padding: 20px;
    }
    h1 {
      margin-top: 0;
    }
    button {
      padding: 14px 18px;
      border: 0;
      border-radius: 12px;
      background: #2563eb;
      color: white;
      font-weight: bold;
      cursor: pointer;
      margin-right: 10px;
      margin-bottom: 10px;
    }
    input, textarea {
      width: 100%;
      padding: 12px;
      border-radius: 10px;
      border: 1px solid rgba(255,255,255,0.12);
      background: #0f1731;
      color: white;
      margin-bottom: 12px;
    }
    pre {
      white-space: pre-wrap;
      word-break: break-word;
      background: #0b1328;
      border-radius: 12px;
      padding: 14px;
      border: 1px solid rgba(255,255,255,0.08);
      min-height: 180px;
    }
    .ok { color: #22c55e; }
    .bad { color: #ef4444; }
    .warn { color: #f4c95d; }
  </style>
</head>
<body>
  <div class="box">
    <h1>VaultForge Diagnostic</h1>
    <p>This page is only for finding the exact failure.</p>

    <input id="email" type="email" placeholder="test@example.com">
    <textarea id="notes" placeholder="Test notes"></textarea>

    <button id="checkScriptBtn" type="button">Check Supabase Script</button>
    <button id="checkFetchBtn" type="button">Check Direct Fetch</button>
    <button id="checkClientBtn" type="button">Check Supabase Client</button>

    <h2>Output</h2>
    <pre id="log"></pre>
  </div>

  <script>
    const logEl = document.getElementById("log");

    function log(message) {
      logEl.textContent += message + "\n";
      console.log(message);
    }

    function logObj(label, obj) {
      const text = typeof obj === "string" ? obj : JSON.stringify(obj, null, 2);
      log(label + ": " + text);
    }

    window.onerror = function(message, source, lineno, colno, error) {
      log("WINDOW ERROR: " + message);
      if (source) log("SOURCE: " + source + ":" + lineno + ":" + colno);
      if (error && error.stack) log("STACK: " + error.stack);
    };

    window.addEventListener("unhandledrejection", function(event) {
      log("UNHANDLED PROMISE REJECTION: " + (event.reason && event.reason.message ? event.reason.message : String(event.reason)));
    });
  </script>

  <script
    src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"
    onload="window.__supabaseScriptLoaded = true"
    onerror="window.__supabaseScriptLoaded = false"
  ></script>

  <script>
    const SUPABASE_URL = "https://mnwwvpuxrzostrplfgmq.supabase.co";
    const SUPABASE_ANON_KEY = "sb_publishable_sXXlF9GsNcVYnr2BxABAwg_T-BV19qJ";

    document.getElementById("checkScriptBtn").addEventListener("click", function () {
      log("---- SCRIPT CHECK ----");
      log("navigator.onLine = " + navigator.onLine);
      log("window.__supabaseScriptLoaded = " + window.__supabaseScriptLoaded);
      log("window.supabase exists = " + !!window.supabase);
      log("window.supabase.createClient exists = " + !!(window.supabase && window.supabase.createClient));
    });

    document.getElementById("checkFetchBtn").addEventListener("click", async function () {
      log("---- DIRECT FETCH CHECK ----");
      try {
        const response = await fetch(SUPABASE_URL + "/rest/v1/", {
          method: "GET",
          headers: {
            apikey: SUPABASE_ANON_KEY,
            Authorization: "Bearer " + SUPABASE_ANON_KEY
          }
        });

        log("Direct fetch status = " + response.status);
        const text = await response.text();
        log("Direct fetch body = " + text);
      } catch (err) {
        log("Direct fetch failed = " + (err && err.message ? err.message : String(err)));
      }
    });

    document.getElementById("checkClientBtn").addEventListener("click", async function () {
      log("---- SUPABASE CLIENT CHECK ----");

      try {
        if (!window.supabase || !window.supabase.createClient) {
          log("Supabase client library is not available.");
          return;
        }

        const client = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
        log("Client created successfully.");

        const payload = {
          full_name: "Diagnostic Test",
          company_name: "VaultForge Diagnostic",
          email: document.getElementById("email").value || "test@example.com",
          phone: "1234567890",
          role: "Buyer",
          market: "Test Market",
          website: "",
          coverage_area: "Test Area",
          services: "Diagnostic submission",
          notes: document.getElementById("notes").value || "Diagnostic notes",
          consent: true,
          status: "pending"
        };

        logObj("Payload", payload);

        const result = await client
          .from("applications")
          .insert([payload])
          .select();

        logObj("Supabase result", result);
      } catch (err) {
        log("Supabase client failed = " + (err && err.message ? err.message : String(err)));
        if (err && err.stack) {
          log("Stack = " + err.stack);
        }
      }
    });
  </script>
</body>
</html>
