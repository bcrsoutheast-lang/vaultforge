<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>VaultForge Member Login</title>
<style>
body{
  margin:0;
  background:#071844;
  color:#fff;
  font-family:Arial,sans-serif;
}
.wrap{
  max-width:520px;
  margin:0 auto;
  padding:24px;
}
.card{
  background:#0d1f59;
  border-radius:22px;
  padding:24px;
  margin-top:40px;
}
h1{
  margin-top:0;
}
label{
  display:block;
  margin:14px 0 6px;
  font-weight:700;
}
input{
  width:100%;
  padding:14px;
  border:none;
  border-radius:12px;
}
button{
  width:100%;
  margin-top:20px;
  padding:16px;
  border:none;
  border-radius:12px;
  background:#16c47f;
  color:#fff;
  font-weight:700;
  font-size:16px;
}
p,a{
  color:#c6d0f2;
}
</style>
</head>
<body>
<div class="wrap">
<div class="card">
<h1>Member Login</h1>
<p>Private access for VaultForge members.</p>

<label>Email</label>
<input id="email" type="email">

<label>Password</label>
<input id="password" type="password">

<button onclick="login()">Enter Member Area</button>

<p style="margin-top:18px;"><a href="/">← Back Home</a></p>
</div>
</div>

<script src="/auth.js"></script>
<script>
function login(){
  const email = document.getElementById("email").value.trim();
  const password = document.getElementById("password").value.trim();

  if(!email || !password){
    alert("Enter email and password");
    return;
  }

  VaultForgeAuth.saveMember({
    email: email
  });

  window.location.href="/members.html";
}
</script>
</body>
</html>
