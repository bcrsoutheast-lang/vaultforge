<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>VaultForge Member Login</title>
<style>
body{
  margin:0;
  background:#071844;
  color:#fff;
  font-family:Arial,sans-serif;
}
.wrap{
  max-width:520px;
  margin:0 auto;
  padding:24px;
}
.card{
  background:#0d1f59;
  border-radius:22px;
  padding:24px;
  margin-top:40px;
}
h1{
  margin-top:0;
}
label{
  display:block;
  margin:14px 0 6px;
  font-weight:700;
}
input{
  width:100%;
  padding:14px;
  border:none;
  border-radius:12px;
  box-sizing:border-box;
}
button{
  width:100%;
  margin-top:20px;
  padding:16px;
  border:none;
  border-radius:12px;
  background:#16c47f;
  color:#fff;
  font-weight:700;
  font-size:16px;
  cursor:pointer;
}
button:disabled{
  opacity:.65;
  cursor:not-allowed;
}
p,a{
  color:#c6d0f2;
}
.notice{
  display:none;
  margin-top:14px;
  padding:12px 14px;
  border-radius:12px;
  font-weight:700;
  line-height:1.4;
}
.notice.show{display:block}
.notice.error{
  background:rgba(217,107,107,.12);
  border:1px solid rgba(217,107,107,.35);
  color:#ffd4d4;
}
.notice.success{
  background:rgba(22,196,127,.12);
  border:1px solid rgba(22,196,127,.35);
  color:#bff3dc;
}
</style>
</head>
<body>
<div class="wrap">
  <div class="card">
    <h1>Member Login</h1>
    <p>Private access for VaultForge members.</p>

    <label for="email">Email</label>
    <input id="email" type="email" autocomplete="email">

    <label for="password">Password</label>
    <input id="password" type="password" autocomplete="current-password">

    <button id="loginBtn" type="button">Enter Member Area</button>

    <div id="errorNotice" class="notice error"></div>
    <div id="successNotice" class="notice success">Login successful. Redirecting…</div>

    <p style="margin-top:18px;"><a href="/">← Back Home</a></p>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="/auth.js"></script>
<script>
const emailEl = document.getElementById('email');
const passwordEl = document.getElementById('password');
const loginBtn = document.getElementById('loginBtn');
const errorNotice = document.getElementById('errorNotice');
const successNotice = document.getElementById('successNotice');

function showError(message) {
  errorNotice.textContent = message;
  errorNotice.classList.add('show');
  successNotice.classList.remove('show');
}

function clearMessages() {
  errorNotice.textContent = '';
  errorNotice.classList.remove('show');
  successNotice.classList.remove('show');
}

function setLoading(isLoading) {
  loginBtn.disabled = isLoading;
  loginBtn.textContent = isLoading ? 'Signing In...' : 'Enter Member Area';
}

async function login() {
  clearMessages();

  const email = emailEl.value.trim();
  const password = passwordEl.value;

  if (!email || !password) {
    showError('Enter email and password.');
    return;
  }

  setLoading(true);

  try {
    await VaultForgeAuth.signIn(email, password);
    successNotice.classList.add('show');
    window.location.href = '/members.html';
  } catch (error) {
    showError(error && error.message ? error.message : 'Login failed.');
  } finally {
    setLoading(false);
  }
}

loginBtn.addEventListener('click', login);

passwordEl.addEventListener('keydown', function (event) {
  if (event.key === 'Enter') login();
});

(async function () {
  try {
    const session = await VaultForgeAuth.getSession();
    if (session) {
      window.location.href = '/members.html';
    }
  } catch (e) {}
})();
</script>
</body>
</html>
