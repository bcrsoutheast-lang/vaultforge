<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>VaultForge Login</title>
<style>
:root{
--bg:#08101f;--panel:#121b39;--line:rgba(255,255,255,.08);
--text:#f5f7ff;--muted:#b4bfd9;--gold:#d6b35f;--gold2:#f1d28a;
}
*{box-sizing:border-box}
body{
margin:0;min-height:100vh;font-family:Arial,sans-serif;color:var(--text);
background:linear-gradient(180deg,#07101e 0%,#08101f 100%);
display:grid;place-items:center;padding:20px;
}
.card{
width:min(460px,100%);
background:rgba(18,27,57,.94);
border:1px solid var(--line);
border-radius:22px;
padding:28px;
}
.brand{
font-weight:700;
letter-spacing:.08em;
text-transform:uppercase;
margin-bottom:18px;
color:var(--gold2);
}
h1{margin:0 0 10px;font-size:2rem}
p{margin:0 0 20px;color:var(--muted);line-height:1.6}
label{display:block;margin:0 0 8px;font-weight:700}
input{
width:100%;
padding:14px;
border-radius:12px;
border:1px solid rgba(255,255,255,.1);
background:#0b1328;color:#fff;
margin-bottom:16px;
}
button{
width:100%;
padding:14px;
border:0;
border-radius:999px;
font-weight:700;
cursor:pointer;
background:linear-gradient(135deg,var(--gold2),var(--gold));
color:#201600;
}
.status{
display:none;
margin:0 0 16px;
padding:12px 14px;
border-radius:12px;
font-size:.95rem;
}
.status.show{display:block}
.error{
background:rgba(239,68,68,.12);
color:#fecaca;
border:1px solid rgba(239,68,68,.25);
}
.success{
background:rgba(34,197,94,.12);
color:#bcf5d0;
border:1px solid rgba(34,197,94,.25);
}
.small{
margin-top:14px;
font-size:.88rem;
color:var(--muted);
text-align:center;
}
</style>
</head>
<body>
<div class="card">
<div class="brand">VaultForge</div>
<h1>Admin Login</h1>
<p>Password only access for admin pages.</p>

<form id="loginForm">
<div id="statusBox" class="status"></div>

<label for="password">Password</label>
<input id="password" type="password" placeholder="Enter password" required>

<button type="submit" id="loginBtn">Login</button>
</form>

<div class="small">Use current VaultForge admin password</div>
</div>

<script src="/auth.js"></script>
<script>
const PASSWORD = "Vault123!";
const form = document.getElementById("loginForm");
const pass = document.getElementById("password");
const box = document.getElementById("statusBox");
const btn = document.getElementById("loginBtn");

function show(type,msg){
box.className="status show "+type;
box.textContent=msg;
}

const params = new URLSearchParams(location.search);
if(params.get("logged_out")==="1"){
show("success","Logged out successfully.");
}

form.addEventListener("submit",function(e){
e.preventDefault();

if(pass.value.trim()!==PASSWORD){
show("error","Incorrect password.");
return;
}

if(!window.VaultForgeAuth){
show("error","Auth system not loaded.");
return;
}

btn.disabled=true;
btn.textContent="Logging in...";
window.VaultForgeAuth.login({email:"admin"});
});
</script>
</body>
</html>
