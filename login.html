<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>VaultForge Login</title>

<style>
:root{
--bg:#08101f;
--panel:#121935;
--line:#2a3766;
--text:#f3f6ff;
--muted:#a8b3d1;
--blue:#3b82f6;
--red:#ef4444;
}

*{box-sizing:border-box}

body{
margin:0;
min-height:100vh;
display:flex;
align-items:center;
justify-content:center;
padding:20px;
font-family:Inter,Arial,sans-serif;
background:linear-gradient(180deg,#08101f 0%,#0b1020 100%);
color:var(--text);
}

.card{
width:100%;
max-width:460px;
background:rgba(18,25,53,.94);
border:1px solid var(--line);
border-radius:22px;
padding:28px;
box-shadow:0 20px 50px rgba(0,0,0,.35);
}

h1{
margin:0 0 8px;
font-size:30px;
}

.sub{
margin:0 0 22px;
color:var(--muted);
line-height:1.5;
}

.field{
display:flex;
flex-direction:column;
gap:8px;
margin-bottom:16px;
}

label{
font-size:14px;
color:#dbe4ff;
}

input{
width:100%;
padding:14px 15px;
border-radius:14px;
border:1px solid var(--line);
background:#0f1731;
color:white;
font:inherit;
}

button{
width:100%;
border:none;
padding:14px 16px;
border-radius:14px;
background:var(--blue);
color:white;
font:inherit;
font-weight:600;
cursor:pointer;
}

button:hover{
opacity:.95;
}

.error{
display:none;
margin-top:14px;
padding:12px 14px;
border-radius:14px;
background:#34131c;
border:1px solid #6b2231;
color:#fecdd3;
}

.note{
margin-top:16px;
color:var(--muted);
font-size:14px;
text-align:center;
}
</style>
</head>

<body>

<div class="card">
  <h1>VaultForge Access</h1>
  <p class="sub">Private access for admin and approved network directory.</p>

  <form id="loginForm">
    <div class="field">
      <label for="password">Password</label>
      <input
        id="password"
        name="password"
        type="password"
        autocomplete="current-password"
        required
      />
    </div>

    <button type="submit">Enter</button>

    <div id="errorBox" class="error">
      Incorrect password.
    </div>
  </form>

  <div class="note">
    Internal use only.
  </div>
</div>

<script type="module">
import {
  attemptLogin,
  getNextRoute,
  isAuthenticated
} from "./auth.js";

const form = document.getElementById("loginForm");
const passwordInput = document.getElementById("password");
const errorBox = document.getElementById("errorBox");

if (isAuthenticated()) {
  window.location.href = getNextRoute();
}

form.addEventListener("submit", function(e){
  e.preventDefault();

  const password = passwordInput.value.trim();
  const ok = attemptLogin(password);

  if (!ok) {
    errorBox.style.display = "block";
    passwordInput.focus();
    passwordInput.select();
    return;
  }

  window.location.href = getNextRoute();
});
</script>

</body>
</html>
