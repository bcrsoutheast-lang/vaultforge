<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>VaultForge Members</title>
<style>
body{
  margin:0;
  background:#071844;
  color:#fff;
  font-family:Arial,sans-serif;
}
.wrap{
  max-width:760px;
  margin:0 auto;
  padding:24px;
}
.card{
  background:#0d1f59;
  border-radius:22px;
  padding:24px;
  margin-top:20px;
}
.grid{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:16px;
}
a.btn,button{
  display:block;
  text-align:center;
  text-decoration:none;
  background:#16c47f;
  color:#fff;
  padding:16px;
  border:none;
  border-radius:12px;
  font-weight:700;
}
.small{
  color:#c6d0f2;
}
</style>
</head>
<body>
<div class="wrap">

<div class="card">
<h1>Member Dashboard</h1>
<p class="small">Private VaultForge access.</p>
</div>

<div class="grid">

<div class="card">
<h3>Pain Button</h3>
<p class="small">Submit urgent deal problems.</p>
<a class="btn" href="/pain.html">Open</a>
</div>

<div class="card">
<h3>Partner Network</h3>
<p class="small">Browse active partners.</p>
<a class="btn" href="/partners.html">Open</a>
</div>

</div>

<div class="card">
<button onclick="logout()">Logout</button>
</div>

</div>

<script src="/auth.js"></script>
<script>
VaultForgeAuth.requireLogin();

function logout(){
  VaultForgeAuth.logout();
}
</script>
</body>
</html>
