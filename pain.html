<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>VaultForge - Pain Button</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
body{margin:0;font-family:Arial,sans-serif;background:#071844;color:#fff}
.wrap{max-width:820px;margin:auto;padding:24px} .card{background:#0d1f59;padding:26px;border-radius:28px}
input,select,textarea,button{width:100%;padding:18px;margin-top:10px;border-radius:18px;font-size:20px}
textarea{min-height:180px} button{background:#e2c465;border:none;font-weight:900}
.msg{margin-top:18px;padding:16px;border-radius:16px;display:none;white-space:pre-wrap}
.err{display:block;background:#351d4f} .ok{display:block;background:#163d2c}
label{display:block;margin-top:16px;font-weight:700}
</style></head>
<body><div class="wrap"><div class="card">
<h1>Pain Button</h1><p>Submit a deal problem into VaultForge.</p>
<form id="f">
<label>Name</label><input id="name" required>
<label>Email</label><input id="email" type="email" required>
<label>Market</label><input id="market" required>
<label>Urgency</label><select id="urgency" required><option value="">Select</option><option>Low</option><option>Medium</option><option>Urgent</option><option>Immediate</option></select>
<label>Need Help From</label><select id="needed_role" required><option value="">Select</option><option>Lender</option><option>Attorney</option><option>Contractor</option><option>Buyer</option><option>Operator</option><option>Other</option></select>
<label>Deal Size / Budget</label><input id="budget">
<label>Describe The Problem</label><textarea id="problem" required></textarea>
<button type="submit">Submit Request</button></form>
<div id="m" class="msg"></div></div></div>
<script>
const supabase=window.supabase.createClient("https://mnwwvpuxrzostrplfgmq.supabase.co","sb_publishable_sXXlF9GsNcVYnr2BxABAwg_T-BV19qJ");
const f=document.getElementById('f'),m=document.getElementById('m');
function show(c,t){m.className='msg '+c;m.textContent=t;}
f.addEventListener('submit',async(e)=>{
e.preventDefault();
const payload={
name:name.value,email:email.value,market:market.value,urgency:urgency.value,
needed_role:needed_role.value,budget:budget.value||null,problem:problem.value,status:'open'
};
const {error}=await supabase.from('pain_requests').insert([payload]);
if(error) show('err',error.message); else {f.reset();show('ok','Request submitted successfully.');}
});
</script></body></html>
