<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>VaultForge Upload</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
body{
background:#07142b;
color:white;
font-family:Arial,Helvetica,sans-serif;
padding:20px;
margin:0;
}

.card{
background:#102347;
padding:20px;
border-radius:18px;
margin-bottom:20px;
}

input,textarea,select{
width:100%;
padding:14px;
margin-top:10px;
margin-bottom:14px;
border-radius:12px;
border:1px solid #334b74;
background:#162b52;
color:white;
font-size:16px;
box-sizing:border-box;
}

button{
padding:14px 20px;
border:none;
border-radius:12px;
font-size:16px;
font-weight:bold;
cursor:pointer;
margin-top:10px;
}

.green{background:#16c784;color:white;}
.red{background:#ff5c73;color:white;}
.gold{background:#d8ad45;color:black;}

img{
width:100%;
border-radius:14px;
margin-top:10px;
}

h2{margin-top:0}
</style>
</head>

<body>

<div class="card">
<h2>Property Upload</h2>

<input id="state" placeholder="State">
<input id="category" placeholder="Category">
<input id="strategy" placeholder="Strategy">
<input id="price" placeholder="Price">
<input id="distress" placeholder="Distress">
<input id="title" placeholder="Deal Title">

<textarea id="description" rows="5" placeholder="Describe the deal"></textarea>

<input type="file" multiple onchange="uploadPhotos(this.files)">

<div id="preview"></div>

<button class="green" onclick="saveDeal()">Save Submission</button>
</div>

<script>
const SUPABASE_URL = "YOUR_SUPABASE_URL";
const SUPABASE_KEY = "YOUR_SUPABASE_ANON_KEY";

const sb = supabase.createClient(SUPABASE_URL,SUPABASE_KEY);

let photos = [];

async function uploadPhotos(files){

photos = [];

for(const file of files){

const ext = file.name.split('.').pop();

const name = Date.now() + "-" + Math.random().toString(36).slice(2) + "." + ext;

const path = "property/" + name;

const { error } = await sb.storage
.from("vaultforge-media")
.upload(path,file,{upsert:true});

if(error){
alert("Upload failed: " + error.message);
return;
}

const { data } = sb.storage
.from("vaultforge-media")
.getPublicUrl(path);

photos.push(data.publicUrl);
}

renderPhotos();
}

function renderPhotos(){

const box = document.getElementById("preview");
box.innerHTML = "";

photos.forEach((url,index)=>{

box.innerHTML += `
<div class="card">
<img src="${url}">
<button class="red" onclick="removePhoto(${index})">Delete Photo</button>
</div>
`;

});
}

function removePhoto(i){
photos.splice(i,1);
renderPhotos();
}

async function saveDeal(){

const payload = {
state:document.getElementById("state").value,
category:document.getElementById("category").value,
strategy:document.getElementById("strategy").value,
price:document.getElementById("price").value,
distress:document.getElementById("distress").value,
title:document.getElementById("title").value,
description:document.getElementById("description").value,
photos:photos
};

const { error } = await sb
.from("pain_deals")
.insert([payload]);

if(error){
alert("Save failed: " + error.message);
return;
}

alert("Saved Successfully");
location.reload();
}
</script>

</body>
</html>
