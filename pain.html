<script>
const SUPABASE_URL='https://mnwwvpuxrzostrplfgmq.supabase.co';
const SUPABASE_KEY='sb_publishable_sXXlF9GsNcVYnr2BxABAwg_T-BV19qJ';
const supabase=window.supabase.createClient(SUPABASE_URL,SUPABASE_KEY);

let activeType='residential';

async function boot(){
  const { data, error } = await supabase.auth.getSession();

  if (error) {
    console.error(error);
  }

  const session = data?.session;
  if (!session) {
    window.location.href='/member-login.html';
    return;
  }

  const memberLine = document.getElementById('memberLine');
  if (memberLine) {
    memberLine.textContent='Logged in as ' + (session.user.email || 'Member');
  }
}

const logoutBtn = document.getElementById('logoutBtn');
if (logoutBtn) {
  logoutBtn.addEventListener('click', async () => {
    await supabase.auth.signOut();
    window.location.href='/member-login.html';
  });
}

function setActiveTab(type){
  activeType = type;

  document.querySelectorAll('.tab').forEach(tab => {
    tab.classList.toggle('active', tab.dataset.type === type);
  });
}

document.querySelectorAll('.tab').forEach(tab => {
  tab.addEventListener('click', () => {
    setActiveTab(tab.dataset.type);
  });
});

const photosInput = document.getElementById('photos');
if (photosInput) {
  photosInput.addEventListener('change', (e) => {
    const preview = document.getElementById('preview');
    if (!preview) return;

    preview.innerHTML = '';

    [...(e.target.files || [])].slice(0, 5).forEach(file => {
      const img = document.createElement('img');
      img.src = URL.createObjectURL(file);
      img.alt = file.name || 'Preview';
      preview.appendChild(img);
    });
  });
}

function scoreDeal(text, urgency, condition, type){
  let score = 55;

  if (urgency === 'High') score += 15;
  if (urgency === 'Medium') score += 8;

  if (condition === 'Light Rehab') score += 10;
  if (condition === 'Medium Rehab') score += 5;
  if (condition === 'Heavy Rehab') score -= 4;

  if (text.includes('vacant')) score += 8;
  if (text.includes('tax')) score += 7;
  if (text.includes('behind')) score += 6;
  if (text.includes('distressed')) score += 8;
  if (text.includes('fire')) score -= 5;
  if (text.includes('foundation')) score -= 8;

  if (type === 'commercial') score += 4;
  if (type === 'land') score += 2;

  if (score > 98) score = 98;
  if (score < 20) score = 20;

  return score;
}

function buyerTypes(type){
  if (type === 'commercial') {
    return [
      'Value-Add Commercial Group',
      'Local Retail / Office Investor',
      'Bridge Lender',
      'Opportunistic PE Fund'
    ];
  }

  if (type === 'land') {
    return [
      'Land Developer',
      'Builder Group',
      'Entitlement Investor',
      '1031 Land Buyer'
    ];
  }

  return [
    'Small Multifamily Buyer',
    'Local Rehab Investor',
    'Syndicator',
    'Private Capital Group'
  ];
}

function memberMatches(type){
  if (type === 'commercial') {
    return [
      'Southeast Commercial Partners (94%)',
      'Atlanta Value-Add Group (90%)',
      'CashFlow Capital (87%)'
    ];
  }

  if (type === 'land') {
    return [
      'Georgia Land Buyers (93%)',
      'Builder Acquisition Group (89%)',
      'South Parcel Holdings (85%)'
    ];
  }

  return [
    'Multifamily Buyers Network (95%)',
    'Chattanooga Operators (91%)',
    'Value Add Holdings (88%)'
  ];
}

function nextSteps(type){
  if (type === 'land') {
    return [
      'Verify zoning',
      'Check utilities access',
      'Survey parcel',
      'Confirm entitlement upside'
    ];
  }

  if (type === 'commercial') {
    return [
      'Request rent roll',
      'Inspect mechanical systems',
      'Review leases',
      'Estimate TI / capex'
    ];
  }

  return [
    'Request T12 / rent roll',
    'Inspect roof + HVAC',
    'Verify taxes / liens',
    'Estimate rehab budget'
  ];
}

function setList(id, items){
  const el = document.getElementById(id);
  if (!el) return;
  el.innerHTML = items.map(item => `<li>${item}</li>`).join('');
}

function runAnalysis(){
  const desc = document.getElementById('desc');
  const urgency = document.getElementById('urgency');
  const condition = document.getElementById('condition');

  const text = String(desc?.value || '').trim().toLowerCase();
  const urgencyValue = urgency?.value || 'Medium';
  const conditionValue = condition?.value || 'Medium Rehab';

  const score = scoreDeal(text, urgencyValue, conditionValue, activeType);

  const blankState = document.getElementById('blankState');
  const results = document.getElementById('results');
  const scoreEl = document.getElementById('score');
  const scoreText = document.getElementById('scoreText');
  const class1 = document.getElementById('class1');
  const class2 = document.getElementById('class2');
  const class3 = document.getElementById('class3');

  if (blankState) blankState.style.display = 'none';
  if (results) results.style.display = 'block';

  if (scoreEl) {
    scoreEl.textContent = String(score);
    scoreEl.className = 'score';

    if (score >= 80) scoreEl.classList.add('good');
    else if (score >= 65) scoreEl.classList.add('warn');
    else scoreEl.classList.add('bad');
  }

  if (scoreText) {
    scoreText.textContent =
      score >= 80 ? 'Strong Opportunity' :
      score >= 65 ? 'Worth Reviewing' :
      'Higher Risk Opportunity';
  }

  if (class1) {
    class1.textContent =
      activeType === 'commercial' ? 'Commercial Distress' :
      activeType === 'land' ? 'Land Opportunity' :
      'Residential / Multifamily Distress';
  }

  if (class2) class2.textContent = urgencyValue + ' Urgency';
  if (class3) class3.textContent = conditionValue;

  setList('buyers', buyerTypes(activeType));
  setList('matches', memberMatches(activeType));
  setList('steps', nextSteps(activeType));
}

const analyzeBtn = document.getElementById('analyzeBtn');
if (analyzeBtn) {
  analyzeBtn.addEventListener('click', runAnalysis);
}

const saveBtn = document.getElementById('saveBtn');
if (saveBtn) {
  saveBtn.addEventListener('click', () => {
    alert('Save is not wired yet in Step 1. Analyze is now fixed first.');
  });
}

setActiveTab('residential');
boot();
</script>
