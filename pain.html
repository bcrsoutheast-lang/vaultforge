<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>VaultForge - Pain Button</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    :root{
      --bg:#071844;
      --panel:#0d1f59;
      --field:#02113f;
      --text:#ffffff;
      --muted:#c6d0f2;
      --gold:#e2c465;
      --danger:#351d4f;
      --success:#163d2c;
      --line:rgba(255,255,255,.10);
    }
    *{box-sizing:border-box}
    body{margin:0;font-family:Arial,sans-serif;background:var(--bg);color:var(--text)}
    .wrap{max-width:860px;margin:auto;padding:24px}
    .top{display:flex;justify-content:space-between;align-items:center;gap:16px;margin-bottom:18px}
    .top a{color:var(--muted);text-decoration:none;font-weight:700}
    .card{background:var(--panel);border:1px solid var(--line);border-radius:28px;padding:26px}
    h1{font-size:42px;line-height:1.05;margin:0 0 10px}
    p{color:var(--muted);font-size:18px;line-height:1.5}
    label{display:block;margin:18px 0 8px;font-weight:800;font-size:18px}
    input,select,textarea{
      width:100%;padding:18px;border-radius:18px;border:1px solid rgba(255,255,255,.12);
      background:var(--field);color:#fff;font-size:20px;outline:none
    }
    textarea{min-height:220px;resize:vertical}
    button{
      margin-top:24px;width:100%;padding:24px;border:none;border-radius:999px;
      background:var(--gold);color:#1e1604;font-size:26px;font-weight:900;cursor:pointer
    }
    button[disabled]{opacity:.7;cursor:wait}
    .msg{margin-top:24px;padding:18px;border-radius:20px;display:none;white-space:pre-wrap;font-size:18px;line-height:1.5}
    .err{display:block;background:var(--danger);border:1px solid #8a3a57;color:#ffd2db}
    .ok{display:block;background:var(--success);border:1px solid #2e8f61;color:#dbffe9}
    small{display:block;margin-top:16px;color:#aab5de;font-size:15px}
    @media (max-width:720px){
      h1{font-size:34px}
      input,select,textarea{font-size:18px}
      button{font-size:22px;padding:22px}
    }
  </style>
</head>
<body>
  <div class="wrap">
    <div class="top">
      <a href="/">← Back to home</a>
      <a href="/admin.html">Admin</a>
    </div>

    <div class="card">
      <h1>Pain Button</h1>
      <p>Need help fast? Submit a deal problem into VaultForge.</p>

      <form id="painForm" novalidate>
        <label for="name">Name</label>
        <input id="name" name="name" required>

        <label for="email">Email</label>
        <input id="email" name="email" type="email" required>

        <label for="market">Market</label>
        <input id="market" name="market" required>

        <label for="urgency">Urgency</label>
        <select id="urgency" name="urgency" required>
          <option value="">Select</option>
          <option>Low</option>
          <option>Medium</option>
          <option>Urgent</option>
          <option>Immediate</option>
        </select>

        <label for="needed_role">Need Help From</label>
        <select id="needed_role" name="needed_role" required>
          <option value="">Select</option>
          <option>Lender</option>
          <option>Attorney</option>
          <option>Contractor</option>
          <option>Buyer</option>
          <option>Operator</option>
          <option>Other</option>
        </select>

        <label for="budget">Deal Size / Budget</label>
        <input id="budget" name="budget">

        <label for="problem">Describe The Problem</label>
        <textarea id="problem" name="problem" required></textarea>

        <button id="submitBtn" type="submit">Submit Request</button>
      </form>

      <div id="msg" class="msg"></div>
      <small>This page writes to pain_requests in Supabase.</small>
    </div>
  </div>

  <script>
    const SUPABASE_URL = 'https://mnwwvpuxrzostrplfgmq.supabase.co';
    const SUPABASE_ANON_KEY = 'sb_publishable_sXXlF9GsNcVYnr2BxABAwg_T-BV19qJ';
    const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    const form = document.getElementById('painForm');
    const submitBtn = document.getElementById('submitBtn');
    const msg = document.getElementById('msg');

    const fields = {
      name: document.getElementById('name'),
      email: document.getElementById('email'),
      market: document.getElementById('market'),
      urgency: document.getElementById('urgency'),
      needed_role: document.getElementById('needed_role'),
      budget: document.getElementById('budget'),
      problem: document.getElementById('problem')
    };

    function showMessage(kind, text) {
      msg.className = 'msg ' + kind;
      msg.textContent = text;
      msg.style.display = 'block';
    }

    function clearMessage() {
      msg.className = 'msg';
      msg.textContent = '';
      msg.style.display = 'none';
    }

    form.addEventListener('submit', async function (e) {
      e.preventDefault();
      clearMessage();

      const payload = {
        name: fields.name.value.trim(),
        email: fields.email.value.trim(),
        market: fields.market.value.trim(),
        urgency: fields.urgency.value,
        needed_role: fields.needed_role.value,
        budget: fields.budget.value.trim() || null,
        problem: fields.problem.value.trim(),
        status: 'open'
      };

      if (!payload.name || !payload.email || !payload.market || !payload.urgency || !payload.needed_role || !payload.problem) {
        showMessage('err', 'Please complete all required fields.');
        return;
      }

      submitBtn.disabled = true;
      submitBtn.textContent = 'Submitting...';

      try {
        const { error } = await supabase.from('pain_requests').insert([payload]);
        if (error) throw error;

        form.reset();
        showMessage('ok', 'Request submitted successfully.');
      } catch (error) {
        showMessage('err', error.message || 'Submission failed.');
      } finally {
        submitBtn.disabled = false;
        submitBtn.textContent = 'Submit Request';
      }
    });
  </script>
</body>
</html>
